<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Metaval Foundry Calculator</title>
  <link
    href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap"
    rel="stylesheet">
  <style>
    :root {
      --bg: #f3f2fb;
      --panel: #ffffff;
      --panel2: #f1eefb;
      --border: #e0d9f5;
      --border-soft: #ece7f9;
      --text: #1a1830;
      --text-dim: #5c5877;
      --text-mute: #918dab;
      --accent: #5b3df0;
      --accent-dim: #c9bdfa;
      --accent2: #0ea5b8;
      --good: #0f9d6e;
      --good-dim: #d6f5e8;
      --warn: #d68c0c;
      --warn-dim: #fcedd0;
      --bad: #e0405a;
      --bad-dim: #fbdde3;
      --radius: 10px;
      --font-display: 'Poppins', ui-sans-serif, system-ui, sans-serif;
      --font-body: 'Inter', ui-sans-serif, system-ui, sans-serif;
      --font-mono: 'IBM Plex Mono', ui-monospace, SFMono-Regular, monospace;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      color: var(--text);
      font-family: var(--font-body);
      background:
        radial-gradient(circle at 8% 0%, rgba(91, 61, 240, .08), transparent 45%),
        radial-gradient(circle at 100% 15%, rgba(14, 165, 184, .08), transparent 40%),
        var(--bg);
      background-attachment: fixed;
    }

    #app {
      min-height: 100vh;
      padding: 28px 20px 60px;
    }

    .wrap {
      max-width: 1180px;
      margin: 0 auto;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 14px;
      margin-bottom: 24px;
      padding: 18px 24px;
      border-radius: 14px;
      background: linear-gradient(135deg, #221a4d 0%, #5b3df0 55%, #0ea5b8 100%);
      background-image:
        linear-gradient(135deg, #221a4d 0%, #5b3df0 55%, #0ea5b8 100%),
        repeating-linear-gradient(0deg, rgba(255, 255, 255, .05) 0px, rgba(255, 255, 255, .05) 1px, transparent 1px, transparent 28px),
        repeating-linear-gradient(90deg, rgba(255, 255, 255, .05) 0px, rgba(255, 255, 255, .05) 1px, transparent 1px, transparent 28px);
      box-shadow: 0 10px 28px -8px rgba(91, 61, 240, .4);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .logo-slot {
      height: 42px;
      width: auto;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .logo-slot img {
      height: 100%;
      width: auto;
      object-fit: contain;
      display: block;
    }

    .brand-text {
      display: flex;
      flex-direction: column;
      gap: 1px;
    }

    .brand-mark {
      font-family: var(--font-mono);
      font-size: 10px;
      letter-spacing: .16em;
      color: #bfe9ee;
      text-transform: uppercase;
    }

    .brand-name {
      font-family: var(--font-display);
      font-weight: 700;
      font-size: 19px;
      color: #fff;
    }

    .mode-toggle {
      display: flex;
      gap: 6px;
      background: rgba(0, 0, 0, .15);
      padding: 5px;
      border-radius: 10px;
    }

    .mode-btn {
      padding: 9px 20px;
      border-radius: 7px;
      border: none;
      background: transparent;
      color: rgba(255, 255, 255, .75);
      font-family: var(--font-display);
      font-weight: 600;
      font-size: 12.5px;
      cursor: pointer;
      letter-spacing: .03em;
      transition: all .15s ease;
    }

    .mode-btn.active {
      background: #fff;
      color: var(--accent);
      box-shadow: 0 3px 10px -3px rgba(0, 0, 0, .3);
    }

    .mode-btn:hover:not(.active) {
      color: #fff;
      background: rgba(255, 255, 255, .12);
    }

    .panel {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 22px 20px 20px;
      margin-bottom: 18px;
      position: relative;
      overflow: hidden;
      box-shadow: 0 1px 2px rgba(45, 25, 120, .04), 0 10px 24px -14px rgba(45, 25, 120, .18);
      transition: box-shadow .18s ease;
    }

    .panel:hover {
      box-shadow: 0 1px 2px rgba(45, 25, 120, .05), 0 14px 30px -14px rgba(45, 25, 120, .22);
    }

    .panel::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 3px;
      background: linear-gradient(90deg, var(--accent), var(--accent2));
    }

    .panel-title {
      font-family: var(--font-display);
      font-weight: 600;
      font-size: 15px;
      margin: 0 0 4px;
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
    }

    .panel-title .ti {
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .panel-title .ti svg {
      flex-shrink: 0;
      color: var(--accent);
    }

    .panel-title .actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .panel-sub {
      font-size: 12px;
      color: var(--text-dim);
      margin: 2px 0 16px;
    }

    .field-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
      gap: 14px;
    }

    .field label {
      display: block;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: .06em;
      color: var(--text-dim);
      margin-bottom: 6px;
    }

    select,
    input[type=number],
    input[type=text] {
      width: 100%;
      background: var(--panel2);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 7px;
      padding: 9px 10px;
      font-family: var(--font-mono);
      font-size: 14px;
      outline: none;
    }

    select {
      font-family: var(--font-body);
      cursor: pointer;
    }

    select:focus,
    input:focus {
      border-color: var(--accent2);
    }

    input:disabled,
    select:disabled {
      opacity: .6;
      cursor: not-allowed;
    }

    .readonly-field {
      background: var(--panel2);
      border: 1px solid var(--border);
      border-radius: 7px;
      padding: 9px 10px;
      font-family: var(--font-mono);
      font-size: 13.5px;
      color: var(--text-dim);
    }

    .invalid-input {
      border-color: var(--bad) !important;
      background: var(--bad-dim) !important;
    }

    table.dtable {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }

    table.dtable th {
      text-align: left;
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: .06em;
      color: var(--text-mute);
      padding: 6px 8px;
      border-bottom: 1px solid var(--border);
      white-space: nowrap;
    }

    table.dtable td {
      padding: 8px;
      border-bottom: 1px solid var(--border-soft);
      vertical-align: middle;
    }

    table.dtable tr:last-child td {
      border-bottom: none;
    }

    table.dtable td.num {
      font-family: var(--font-mono);
      text-align: right;
    }

    table.dtable input[type=number] {
      padding: 6px 8px;
      font-size: 13px;
      min-width: 70px;
    }

    table.dtable select {
      padding: 6px 8px;
      font-size: 12.5px;
      min-width: 160px;
    }

    table.dtable .elname {
      font-weight: 600;
    }

    table.dtable td.dev-pos {
      color: var(--good);
      font-family: var(--font-mono);
      text-align: right;
    }

    table.dtable td.dev-neg {
      color: var(--bad);
      font-family: var(--font-mono);
      text-align: right;
    }

    .status-pill {
      display: inline-block;
      font-family: var(--font-mono);
      font-size: 10.5px;
      font-weight: 600;
      padding: 3px 9px;
      border-radius: 20px;
      text-transform: uppercase;
      letter-spacing: .03em;
      white-space: nowrap;
    }

    .status-ok {
      background: var(--good-dim);
      color: var(--good);
    }

    .status-low {
      background: var(--warn-dim);
      color: var(--warn);
    }

    .status-high {
      background: var(--bad-dim);
      color: var(--bad);
    }

    .status-na {
      background: var(--panel2);
      color: var(--text-mute);
    }

    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .chip {
      font-family: var(--font-mono);
      font-size: 12px;
      padding: 5px 12px;
      border-radius: 20px;
      background: var(--panel2);
      border: 1px solid var(--border);
      color: var(--text-dim);
    }

    .btn {
      cursor: pointer;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--panel2);
      color: var(--text-dim);
      padding: 8px 14px;
      font-size: 12.5px;
      font-family: var(--font-body);
      transition: transform .12s ease, box-shadow .12s ease, border-color .12s ease, color .12s ease;
    }

    .btn:hover {
      border-color: var(--text-mute);
      color: var(--text);
      transform: translateY(-1px);
      box-shadow: 0 4px 10px -4px rgba(16, 35, 55, .18);
    }

    .btn-accent {
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      border-color: var(--accent);
      color: #fff;
      font-weight: 600;
      box-shadow: 0 3px 12px -3px rgba(91, 61, 240, .55);
    }

    .btn-accent:hover {
      filter: brightness(1.08);
      transform: translateY(-1px);
    }

    .btn-sm {
      padding: 5px 11px;
      font-size: 11.5px;
    }

    .btn:disabled {
      opacity: .45;
      cursor: not-allowed;
      transform: none !important;
      box-shadow: none !important;
    }

    .row-remove {
      cursor: pointer;
      color: var(--bad);
      background: none;
      border: none;
      font-size: 17px;
      line-height: 1;
      padding: 2px 8px;
      border-radius: 6px;
    }

    .row-remove:hover {
      background: var(--bad-dim);
    }

    .cost-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 14px;
    }

    .cost-card {
      background: var(--panel2);
      border: 1px solid var(--border);
      border-radius: 9px;
      padding: 14px 16px;
    }

    .cost-card .lbl {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: .05em;
      color: var(--text-dim);
      margin-bottom: 6px;
    }

    .cost-card .val {
      font-family: var(--font-mono);
      font-size: 19px;
      font-weight: 600;
      color: var(--text);
    }

    .cost-card.editable input {
      background: transparent;
      border: none;
      padding: 0;
      font-size: 19px;
      font-weight: 600;
      color: var(--text);
    }

    .cost-card.highlight {
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      border-color: var(--accent);
      box-shadow: 0 6px 16px -6px rgba(91, 61, 240, .45);
    }

    .cost-card.highlight .lbl {
      color: rgba(255, 255, 255, .8);
    }

    .cost-card.highlight .val {
      color: #fff;
    }

    .cost-card.profit-pos .val {
      color: var(--good);
    }

    .cost-card.profit-neg .val {
      color: var(--bad);
    }

    .totals-row {
      font-family: var(--font-mono);
      font-size: 12.5px;
      color: var(--text-dim);
      display: flex;
      gap: 24px;
      justify-content: flex-end;
      flex-wrap: wrap;
      padding-top: 10px;
      margin-top: 6px;
      border-top: 1px solid var(--border);
    }

    .totals-row b {
      color: var(--text);
    }

    .note {
      font-size: 11.5px;
      color: var(--text-mute);
      line-height: 1.5;
      margin-top: 6px;
    }

    .data-warning {
      display: flex;
      gap: 10px;
      align-items: flex-start;
      background: var(--bad-dim);
      border: 1px solid var(--bad);
      border-radius: 9px;
      padding: 12px 14px;
      margin-bottom: 16px;
      font-size: 12.5px;
      color: #8a1330;
      line-height: 1.5;
    }

    .data-warning svg {
      flex-shrink: 0;
      margin-top: 1px;
      color: var(--bad);
    }

    .data-warning b {
      color: #8a1330;
    }

    .banner-info {
      display: flex;
      gap: 10px;
      align-items: flex-start;
      background: var(--warn-dim);
      border: 1px solid var(--warn);
      border-radius: 9px;
      padding: 12px 14px;
      margin-bottom: 16px;
      font-size: 12.5px;
      color: #7a5206;
      line-height: 1.5;
    }

    .banner-info svg {
      flex-shrink: 0;
      margin-top: 1px;
      color: var(--warn);
    }

    .banner-info b {
      color: #7a5206;
    }

    .details-toggle {
      cursor: pointer;
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--accent);
      background: none;
      border: none;
      padding: 0;
      text-decoration: underline;
    }

    .calc-details-box {
      margin-top: 14px;
      padding: 14px 16px;
      background: var(--panel2);
      border: 1px dashed var(--border);
      border-radius: 9px;
      font-family: var(--font-mono);
      font-size: 12px;
      line-height: 1.8;
      color: var(--text-dim);
    }

    .calc-details-box b {
      color: var(--text);
    }

    .calc-details-box .cd-line {
      display: flex;
      justify-content: space-between;
      gap: 14px;
      border-bottom: 1px dotted var(--border);
      padding: 3px 0;
    }

    .calc-details-box .cd-line:last-child {
      border-bottom: none;
    }

    .placeholder-box {
      text-align: center;
      padding: 56px 20px;
    }

    .placeholder-box .icn {
      color: var(--text-mute);
      margin-bottom: 14px;
    }

    .placeholder-box h3 {
      font-family: var(--font-display);
      color: var(--text);
      margin: 0 0 8px;
      font-size: 17px;
      letter-spacing: .03em;
    }

    .placeholder-box p {
      color: var(--text-dim);
      font-size: 13px;
      max-width: 520px;
      margin: 0 auto;
      line-height: 1.6;
    }

    .footer-actions {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      margin-top: 4px;
    }

    @media (max-width:800px) {
      table.dtable {
        display: block;
        overflow-x: auto;
        white-space: nowrap;
      }

      .topbar {
        flex-direction: column;
        align-items: stretch;
      }

      .mode-toggle {
        justify-content: center;
      }
    }

    /* ============ HEAT CONTROL ADDITIONS ============ */
    .dash-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 12px;
    }

    .dash-card {
      background: var(--panel2);
      border: 1px solid var(--border);
      border-radius: 9px;
      padding: 12px 14px;
    }

    .dash-card .lbl {
      font-size: 10.5px;
      text-transform: uppercase;
      letter-spacing: .05em;
      color: var(--text-dim);
      margin-bottom: 5px;
    }

    .dash-card .val {
      font-family: var(--font-mono);
      font-size: 16px;
      font-weight: 600;
      color: var(--text);
      word-break: break-word;
    }

    .heat-status-pill {
      display: inline-block;
      font-family: var(--font-mono);
      font-size: 11px;
      font-weight: 700;
      padding: 4px 12px;
      border-radius: 20px;
      text-transform: uppercase;
      letter-spacing: .03em;
    }

    .hs-DRAFT {
      background: var(--panel2);
      color: var(--text-mute);
    }

    .hs-CHARGE-PLANNED,
    .hs-OES-1-PENDING {
      background: var(--warn-dim);
      color: var(--warn);
    }

    .hs-CORRECTION-REQUIRED {
      background: var(--bad-dim);
      color: var(--bad);
    }

    .hs-OES-2-PENDING {
      background: var(--warn-dim);
      color: var(--warn);
    }

    .hs-READY-FOR-RELEASE {
      background: var(--good-dim);
      color: var(--good);
    }

    .hs-RELEASED {
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      color: #fff;
    }

    .hs-HOLD {
      background: var(--bad-dim);
      color: var(--bad);
    }

    .hs-REJECTED {
      background: var(--bad-dim);
      color: var(--bad);
    }

    .conf-HIGH {
      color: var(--good);
    }

    .conf-MEDIUM {
      color: var(--warn);
    }

    .conf-LOW {
      color: var(--bad);
    }

    .conf-INSUFFICIENT {
      color: var(--bad);
    }

    .warn-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .warn-item {
      display: flex;
      gap: 10px;
      align-items: flex-start;
      padding: 10px 12px;
      border-radius: 8px;
      font-size: 12.5px;
      line-height: 1.5;
    }

    .warn-CRITICAL {
      background: var(--bad-dim);
      color: #8a1330;
      border: 1px solid var(--bad);
    }

    .warn-WARNING {
      background: var(--warn-dim);
      color: #7a5206;
      border: 1px solid var(--warn);
    }

    .warn-INFO {
      background: var(--panel2);
      color: var(--text-dim);
      border: 1px solid var(--border);
    }

    .warn-badge {
      font-family: var(--font-mono);
      font-size: 9.5px;
      font-weight: 700;
      padding: 2px 7px;
      border-radius: 5px;
      text-transform: uppercase;
      flex-shrink: 0;
    }

    .warn-CRITICAL .warn-badge {
      background: var(--bad);
      color: #fff;
    }

    .warn-WARNING .warn-badge {
      background: var(--warn);
      color: #fff;
    }

    .warn-INFO .warn-badge {
      background: var(--text-mute);
      color: #fff;
    }

    .subsection-title {
      font-family: var(--font-display);
      font-weight: 600;
      font-size: 12.5px;
      color: var(--text);
      margin: 18px 0 8px;
      text-transform: uppercase;
      letter-spacing: .04em;
    }

    .subsection-title:first-child {
      margin-top: 0;
    }

    .na-tag {
      font-family: var(--font-mono);
      font-size: 10.5px;
      color: var(--text-mute);
      background: var(--panel2);
      border: 1px dashed var(--border);
      padding: 2px 8px;
      border-radius: 5px;
    }

    .correction-card {
      background: var(--panel2);
      border: 1px solid var(--border);
      border-radius: 9px;
      padding: 12px 14px;
      margin-bottom: 10px;
    }

    .correction-card .cc-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 6px;
    }

    .correction-card .cc-el {
      font-family: var(--font-display);
      font-weight: 700;
      font-size: 14px;
    }

    .correction-card .cc-body {
      font-size: 12.5px;
      color: var(--text-dim);
      line-height: 1.7;
    }

    .correction-card .cc-body b {
      color: var(--text);
      font-family: var(--font-mono);
    }

    .approval-row {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 0;
      border-bottom: 1px dotted var(--border);
    }

    .approval-row:last-child {
      border-bottom: none;
    }

    .approval-row input[type=checkbox] {
      width: 16px;
      height: 16px;
      accent-color: var(--accent);
      cursor: pointer;
    }

    .approval-row label {
      font-size: 12.5px;
      color: var(--text);
      cursor: pointer;
    }

    .history-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      margin-bottom: 8px;
      flex-wrap: wrap;
    }

    .history-item .hi-main {
      font-size: 12.5px;
    }

    .history-item .hi-main b {
      font-family: var(--font-mono);
      color: var(--text);
    }

    .history-item .hi-actions {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }

    .master-admin-table input[type=number] {
      min-width: 56px;
    }

    .honesty-note {
      font-size: 11px;
      color: var(--text-mute);
      background: var(--panel2);
      border: 1px dashed var(--border);
      border-radius: 8px;
      padding: 8px 12px;
      margin-top: 10px;
      line-height: 1.5;
    }

    /* INTERNAL EMPLOYEE CHAT */
    .chat-launch {
      position: fixed;
      right: 22px;
      bottom: 22px;
      z-index: 9999;
      border: 0;
      border-radius: 50%;
      width: 58px;
      height: 58px;
      background: linear-gradient(135deg, #5b3df0, #0ea5b8);
      color: #fff;
      font-size: 24px;
      cursor: pointer;
      box-shadow: 0 8px 24px #0003
    }

    .chat-panel {
      position: fixed;

  <script>
    /* =====================================================================================
       METAVAL FOUNDRY CALCULATOR — CASTING + INGOT
       Data-driven engine: all chemistry / scrap / rate values come from a single master-data
       object per calculator. UI and calculations read from that object only (see section 25
       of the project brief — "do not duplicate master data").
       ===================================================================================== */

    /* ================= 1. RAW SOURCE DATA =================
       This is the exact "METAVAL CALCULATOR" master-data block from
       METAVAL_FOUNDRY_ADVANCED_CALCULATOR_V10.xlsx (grade Min/Max + scrap chemistry & rate).
       Values are taken as-is from the workbook — nothing here is invented or estimated.
       To add/update grades or scrap, edit the Excel and refresh this block. */
    const RAW_CASTING_DATA = { "gradesList": [{ "name": "CAST IRON", "comp": { "C": [2.5, 3.8], "Si": [1, 2.5], "Mn": [0.2, 1], "P": [0, 1], "S": [0, 1], "Cr": [0, 0.5], "Ni": [0, 0.2], "Mo": [0, 0], "V": [0, 0.12], "Nb": [0, 0.12] }, "scraps": ["Cast Iron Scrap", "Ductile Iron Scrap", "MS Scrap"] }, { "name": "DUCTILE IRON", "comp": { "C": [3.2, 3.8], "Si": [2, 3], "Mn": [0.1, 0.5], "P": [0, 1], "S": [0, 1], "Cr": [0, 0.5], "Ni": [0, 0.2], "Mo": [0, 0], "V": [0, 0.08], "Nb": [0, 0.03] }, "scraps": ["Ductile Iron Scrap", "Cast Iron Scrap", "MS Scrap"] }, { "name": "WCB", "comp": { "C": [0.2, 0.3], "Si": [0, 0.6], "Mn": [0.5, 1], "P": [0, 0.3], "S": [0, 0.5], "Cr": [0, 0.2], "Ni": [0, 0.1], "Mo": [0, 0.1], "V": [0, 0.04], "Nb": [0, 0.04] }, "scraps": ["WCB Return", "C45 Scrap", "MS Scrap"] }, { "name": "C45", "comp": { "C": [0.42, 0.5], "Si": [0, 0.4], "Mn": [0.5, 0.8], "P": [0, 0.4], "S": [0, 0.4], "Cr": [0, 0.1], "Ni": [0, 0.1], "Mo": [0, 0.05], "V": [0, 0.04], "Nb": [0, 0.04] }, "scraps": ["C45 Scrap", "WCB Return", "MS Scrap"] }, { "name": "CF8", "comp": { "C": [0.08, 0.2], "Si": [0, 2], "Mn": [0, 2], "P": [18, 21], "S": [8, 11], "Cr": [0, 0.5], "Ni": [0, 0.2], "Mo": [0, 0.5], "V": [0, 0.045], "Nb": [0, 0.04] }, "scraps": ["CF8 Return", "304 Scrap", "310 Scrap", "MS Scrap"] }, { "name": "CF8M", "comp": { "C": [0.08, 0.2], "Si": [0, 2], "Mn": [0, 2], "P": [18, 21], "S": [9, 13], "Cr": [2, 3], "Ni": [0, 0.2], "Mo": [0, 0.5], "V": [0, 0.045], "Nb": [0, 0.04] }, "scraps": ["CF8M Return", "316 Scrap", "CF8 Return", "304 Scrap"] }, { "name": "304", "comp": { "C": [0, 0.08], "Si": [0, 1], "Mn": [0, 2], "P": [18, 20], "S": [8, 10.5], "Cr": [0, 0.5], "Ni": [0, 0.1], "Mo": [0, 0.5], "V": [0, 0.045], "Nb": [0, 0.03] }, "scraps": ["304 Scrap", "CF8 Return", "CF8M Return", "310 Scrap"] }, { "name": "316", "comp": { "C": [0, 0.08], "Si": [0, 1], "Mn": [0, 2], "P": [16, 18], "S": [10, 14], "Cr": [2, 3], "Ni": [0, 0.1], "Mo": [0, 0.5], "V": [0, 0.045], "Nb": [0, 0.03] }, "scraps": ["316 Scrap", "CF8M Return", "304 Scrap"] }, { "name": "310", "comp": { "C": [0, 0.08], "Si": [0, 1.5], "Mn": [0, 2], "P": [24, 26], "S": [19, 22], "Cr": [0, 0.5], "Ni": [0, 0.1], "Mo": [0, 0.5], "V": [0, 0.045], "Nb": [0, 0.03] }, "scraps": ["310 Scrap", "304 Scrap", "CF8 Return"] }, { "name": "330", "comp": { "C": [0, 0.08], "Si": [0, 1.5], "Mn": [0, 2], "P": [18, 22], "S": [34, 37], "Cr": [0, 0.5], "Ni": [0, 0.1], "Mo": [0, 0.5], "V": [0, 0.045], "Nb": [0, 0.03] }, "scraps": ["330 Scrap", "310 Scrap", "Inconel 625 Scrap"] }, { "name": "HK", "comp": { "C": [0.2, 0.5], "Si": [0, 2], "Mn": [0.5, 2], "P": [22, 26], "S": [9, 13], "Cr": [0, 1], "Ni": [0, 1], "Mo": [0, 1], "V": [0, 0.04], "Nb": [0, 0.04] }, "scraps": ["HK Return", "310 Scrap", "CF8 Return"] }, { "name": "HN", "comp": { "C": [0.2, 0.5], "Si": [0, 2], "Mn": [0.5, 2], "P": [19, 23], "S": [24, 28], "Cr": [0, 1], "Ni": [0, 1], "Mo": [0, 1], "V": [0, 0.04], "Nb": [0, 0.04] }, "scraps": ["HN Return", "HT Return", "HK Return"] }, { "name": "HT", "comp": { "C": [0.3, 0.5], "Si": [0, 2], "Mn": [0.5, 2], "P": [15, 20], "S": [35, 40], "Cr": [0, 1], "Ni": [0, 1], "Mo": [0, 1], "V": [0, 0.04], "Nb": [0, 0.04] }, "scraps": ["HT Return", "HN Return", "HK Return"] }, { "name": "INCONEL 625", "comp": { "C": [0, 0.15], "Si": [0, 0.5], "Mn": [0, 0.5], "P": [20, 23], "S": [58, 63], "Cr": [8, 10], "Ni": [0, 0.5], "Mo": [3.15, 4.15], "V": [0, 0.015], "Nb": [0, 0.015] }, "scraps": ["Inconel 625 Scrap", "330 Scrap"] }, { "name": "P91 TYPE 2", "comp": { "C": [0.08, 0.12], "Si": [0, 0.5], "Mn": [0.3, 0.6], "P": [8, 9.5], "S": [0.3, 0.6], "Cr": [0.85, 1.05], "Ni": [0.18, 0.25], "Mo": [0.06, 0.1], "V": [0, 0.02], "Nb": [0, 0.01] }, "scraps": ["P91 Scrap", "16Mo3 Scrap"] }, { "name": "16MO3", "comp": { "C": [0.12, 0.2], "Si": [0, 0.35], "Mn": [0.3, 0.9], "P": [0, 0.3], "S": [0, 0.3], "Cr": [0.25, 0.35], "Ni": [0, 0.1], "Mo": [0, 0.05], "V": [0, 0.025], "Nb": [0, 0.025] }, "scraps": ["16Mo3 Scrap", "P91 Scrap", "C45 Scrap"] }], "scrapDb": { "16Mo3 Scrap": { "C": 0.16, "Si": 0.25, "Mn": 0.6, "Cr": 0.15, "Ni": 0.1, "Mo": 0.3, "V": 0, "S": 0.02, "rate": 90 }, "304 Scrap": { "C": 0.05, "Si": 0.4, "Mn": 1, "Cr": 18.5, "Ni": 8.2, "Mo": 0, "V": 0, "S": 0.02, "rate": 140 }, "310 Scrap": { "C": 0.05, "Si": 0.6, "Mn": 1.5, "Cr": 25, "Ni": 20, "Mo": 0, "V": 0, "S": 0.02, "rate": 200 }, "316 Scrap": { "C": 0.05, "Si": 0.45, "Mn": 1.2, "Cr": 17, "Ni": 12, "Mo": 2.3, "V": 0, "S": 0.02, "rate": 175 }, "330 Scrap": { "C": 0.05, "Si": 0.6, "Mn": 1.2, "Cr": 20, "Ni": 35, "Mo": 0, "V": 0, "S": 0.02, "rate": 260 }, "C45 Scrap": { "C": 0.45, "Si": 0.25, "Mn": 0.7, "Cr": 0.2, "Ni": 0, "Mo": 0, "V": 0, "S": 0.035, "rate": 70 }, "CF8 Return": { "C": 0.1, "Si": 1, "Mn": 1.2, "Cr": 19, "Ni": 9, "Mo": 0, "V": 0, "S": 0.025, "rate": 135 }, "CF8M Return": { "C": 0.1, "Si": 1, "Mn": 1.2, "Cr": 19, "Ni": 11, "Mo": 2.3, "V": 0, "S": 0.025, "rate": 155 }, "Cast Iron Scrap": { "C": 3.2, "Si": 2, "Mn": 0.6, "Cr": 0.2, "Ni": 0, "Mo": 0, "V": 0, "S": 0.08, "rate": 50 }, "Ductile Iron Scrap": { "C": 3.4, "Si": 2.4, "Mn": 0.35, "Cr": 0.15, "Ni": 0, "Mo": 0, "V": 0, "S": 0.02, "rate": 65 }, "HK Return": { "C": 0.35, "Si": 1, "Mn": 1, "Cr": 24, "Ni": 11, "Mo": 0, "V": 0, "S": 0.03, "rate": 180 }, "HN Return": { "C": 0.35, "Si": 1, "Mn": 1, "Cr": 21, "Ni": 26, "Mo": 0, "V": 0, "S": 0.03, "rate": 190 }, "HT Return": { "C": 0.4, "Si": 1, "Mn": 1, "Cr": 18, "Ni": 37, "Mo": 0, "V": 0, "S": 0.03, "rate": 210 }, "Inconel 625 Scrap": { "C": 0.08, "Si": 0.35, "Mn": 0.25, "Cr": 21.5, "Ni": 61, "Mo": 9, "V": 0, "S": 0.01, "rate": 1200 }, "MS Scrap": { "C": 0.12, "Si": 0.25, "Mn": 0.6, "Cr": 0.05, "Ni": 0, "Mo": 0, "V": 0, "S": 0.04, "rate": 55 }, "P91 Scrap": { "C": 0.1, "Si": 0.3, "Mn": 0.5, "Cr": 8.7, "Ni": 0.45, "Mo": 0.95, "V": 0.21, "S": 0.01, "rate": 300 }, "WCB Return": { "C": 0.25, "Si": 0.4, "Mn": 0.7, "Cr": 0.2, "Ni": 0.1, "Mo": 0.1, "V": 0, "S": 0.035, "rate": 65 } } };

    /* ================= 2. ELEMENT DEFINITIONS ================= */
    // Full chemistry element set the grade specs track (min/max windows).
    const ELEMENTS = ['C', 'Si', 'Mn', 'Cr', 'Ni', 'Mo', 'V', 'Nb', 'P', 'S'];
    // Elements the scrap/return database actually carries composition figures for.
    // Nb and P are not present as columns in the source scrap sheet, so they default to 0
    // (a valid value, not invented data) wherever a weighted charge chemistry is computed —
    // this mirrors the original application's behaviour and the underlying Excel workbook.
    const CHARGE_ELEMENTS = ['C', 'Si', 'Mn', 'Cr', 'Ni', 'Mo', 'V', 'P', 'S'];

    /* ================= 3. MASTER DATA OBJECTS =================
       castingMasterData / ingotMasterData — the single source of truth the whole UI reads from.
       Shape:
         { grades: [ { name, chemistry: { EL:{min,max} }, compatibleScrap:[names] } ],
           scrapMaterials: { name: { rate, chemistry:{ EL: value } } } } */
    const castingMasterData = {
      grades: RAW_CASTING_DATA.gradesList.map(g => {
        const chemistry = {};
        ELEMENTS.forEach(el => {
          const range = g.comp[el] || [0, 0];
          chemistry[el] = { min: range[0], max: range[1] };
        });
        return { name: g.name, chemistry, compatibleScrap: g.scraps.slice() };
      }),
      scrapMaterials: Object.fromEntries(Object.entries(RAW_CASTING_DATA.scrapDb).map(([name, comp]) => {
        const chemistry = {};
        CHARGE_ELEMENTS.forEach(el => { chemistry[el] = comp[el] || 0; });
        return [name, { rate: comp.rate || 0, chemistry }];
      }))
    };

    // Ingot Calculator: dedicated, independent master data structure (its own object — editing
    // Ingot data can NEVER mutate castingMasterData, and vice versa).
    // PROVENANCE / NO-FABRICATION NOTE: the supplied workbook does not contain a separate
    // "Ingot" sheet with its own Min/Max chemistry or raw-material rates. An ingot is remelt
    // stock of a specific alloy grade, so — rather than inventing new numbers — this mirrors the
    // EXACT Min/Max chemistry windows and material chemistry/rates already present in the
    // workbook's grade/scrap tables (RAW_CASTING_DATA), applied to Ingot production. No chemistry
    // value, rate or compatibility mapping below differs from what Metaval supplied. If Metaval
    // has separate ingot-specific specifications or rates, replace this block (or edit live via
    // Master Data → grades are still read-only from source; scrap rates can be tuned per-heat).
    const ingotMasterData = {
      grades: RAW_CASTING_DATA.gradesList.map(g => {
        const chemistry = {};
        ELEMENTS.forEach(el => {
          const range = g.comp[el] || [0, 0];
          chemistry[el] = { min: range[0], max: range[1] };
        });
        return { name: g.name, chemistry, compatibleScrap: g.scraps.slice() };
      }),
      scrapMaterials: Object.fromEntries(Object.entries(RAW_CASTING_DATA.scrapDb).map(([name, comp]) => {
        const chemistry = {};
        CHARGE_ELEMENTS.forEach(el => { chemistry[el] = comp[el] || 0; });
        return [name, { rate: comp.rate || 0, chemistry }];
      }))
    };
    const INGOT_DATA_MIRRORS_CASTING = true; // drives the provenance banner shown in Ingot mode

    function masterDataFor(calcName) { return calcName === 'ingot' ? ingotMasterData : castingMasterData; }

    /* ================= 3b. ALLOY ADDITION MASTER (sections 17, 47) =================
       Configurable correction-addition master data (FeSi, FeMn, FeCr, Nickel, Carburizer, etc.).
       This is NOT part of the supplied workbook — the workbook contains no alloy/recovery data —
       so per the No-Fabrication Policy this starts EMPTY and is only populated by values a
       metallurgist/plant engineer explicitly enters below (Master Data → Alloy Additions). It is
       stored separately from any single heat, exactly like castingMasterData/ingotMasterData. */
    const ALLOY_MASTER_KEY = 'metaval_alloy_addition_master_v1';
    function loadAlloyMaster() {
      try {
        const raw = localStorage.getItem(ALLOY_MASTER_KEY);
        if (!raw) return [];
        const parsed = JSON.parse(raw);
        return Array.isArray(parsed) ? parsed : [];
      } catch (e) { return []; }
    }
    function saveAlloyMaster() {
      try { localStorage.setItem(ALLOY_MASTER_KEY, JSON.stringify(alloyAdditionMaster)); }
      catch (e) { console.warn('Could not persist Alloy Addition Master to local storage.', e); }
    }
    let alloyAdditionMaster = loadAlloyMaster();
    function newAlloyAddition() {
      return { id: uid(), name: '', chemistry: {}, recovery: {}, rate: 0, active: true, notes: '' };
    }

    /* ================= 3c. FURNACE MASTER (section 29) =================
       Configurable, empty until plant data is entered — never fabricated. */
    const FURNACE_MASTER_KEY = 'metaval_furnace_master_v1';
    function loadFurnaceMaster() {
      try {
        const raw = localStorage.getItem(FURNACE_MASTER_KEY);
        const parsed = raw ? JSON.parse(raw) : [];
        return Array.isArray(parsed) ? parsed : [];
      } catch (e) { return []; }
    }
    function saveFurnaceMaster() {
      try { localStorage.setItem(FURNACE_MASTER_KEY, JSON.stringify(furnaceMaster)); }
      catch (e) { console.warn('Could not persist Furnace Master to local storage.', e); }
    }
    let furnaceMaster = loadFurnaceMaster();
    function newFurnace() {
      return { id: uid(), furnaceId: '', furnaceType: '', capacity: '', ratedPower: '', typicalYield: '', meltingRate: '', powerConsumption: '', active: true };
    }

    /* ================= 3c2. INGOT PRODUCT MASTER (Ingot Calculator, sections 6, 38) =================
       Configurable ingot-product identity data (product name, grade link, specification, customer,
       target weight, tolerance). Empty by default — the supplied workbook has no ingot-specific
       data. This lets the Ingot Calculator's identity/traceability layer be configured and used
       immediately, independently of whether ingotMasterData.grades (chemistry) has been populated. */
    const INGOT_PRODUCT_MASTER_KEY = 'metaval_ingot_product_master_v1';
    function loadIngotProductMaster() {
      try {
        const raw = localStorage.getItem(INGOT_PRODUCT_MASTER_KEY);
        const parsed = raw ? JSON.parse(raw) : [];
        return Array.isArray(parsed) ? parsed : [];
      } catch (e) { return []; }

    function saveIngotProductMaster() {

    const HEAT_SEQ_KEY = 'metaval_heat_sequence_v1';
    function generateHeatId() {
      const year = new Date().getFullYear();
      let seq = {};
      try { seq = JSON.parse(localStorage.getItem(HEAT_SEQ_KEY) || '{}') || {}; } catch (e) { seq = {}; }
      const n = (seq[year] || 0) + 1;
      seq[year] = n;
      try { localStorage.setItem(HEAT_SEQ_KEY, JSON.stringify(seq)); } catch (e) { }
      return `HT-${year}-${String(n).padStart(5, '0')}`;
    }

    const HISTORY_KEY = 'metaval_foundry_calculator_v3';

    function loadHistory() {
      let raw;
      try { raw = localStorage.getItem(HISTORY_KEY); } catch (e) { return []; }
      if (!raw) {
        // Attempt a best-effort migration from a plausible older key. If it doesn't parse
        // as a usable array, we do NOT crash — we simply start with empty history.
        try {
          const legacy = localStorage.getItem('metaval_foundry_calculator_v2') || localStorage.getItem('metaval_foundry_calculator');
          if (legacy) {
            const parsedLegacy = JSON.parse(legacy);
            if (Array.isArray(parsedLegacy)) return parsedLegacy.map(h => ({ ...h, migrated: true }));
          }
        } catch (e) { /* corrupted legacy data — ignore, start fresh */ }
        return [];
      }
      try {
        const parsed = JSON.parse(raw);
        return Array.isArray(parsed) ? parsed : [];
      } catch (e) {
        console.warn('Heat history in local storage was corrupted and could not be read. Starting with empty history.');
        return [];
      }
    }

    /* ================= 4. STATE ================= */
    function freshCalcState() {
      return {
        grade: '',
        heatSize: '1500',
        yieldPct: '95',
        meltingRate: '',
        powerRate: '4',
        otherRate: '10',
        sellingPrice: '120',
        target: {},       // { gradeName: { element: value(string) } } -- this is the AIM value used across the app
        oes: {},          // { gradeName: { element: value(string) } } -- OES-1 (post-melt, pre-correction)
        chargeRows: {},   // { gradeName: [ {id, scrap, qty} ] }
        showDetails: false,
        lastAutoNote: null, // { exact:boolean, maxDev:number } | null

        /* ---- Heat Management / Correction / Quality additions ---- */
        heat: {
          heatId: '', date: '', time: '',
          furnaceId: '', furnaceType: '', operator: '', meltingIncharge: '', metallurgist: '',
          customer: '', product: '', partNumber: '', drawingNumber: '', drawingRevision: '', poNumber: '', workOrder: ''
        },
        customerAimApproved: false,   // user-confirmed: current AIM = Customer Approved Specification
        oesTwo: {},                   // { gradeName: { element: value(string) } } -- OES-2 (post-correction / final)
        corrections: {},              // { gradeName: [ {id, additionId, qty(string)} ] } -- applied alloy additions for this heat
        residualElements: {},         // { gradeName: [element,...] } -- residuals tracked for this heat
        residualLimits: {},           // { gradeName: { element: maxValue(string) } } -- plant/customer configured limit
        residualActual: {},           // { gradeName: { element: value(string) } }
        yieldLoss: {},                // { gradeName: { chargedWeight, slagLoss, oxidationLoss, handlingLoss, pouringLoss, otherLoss, finalMetalWeight } }
        processData: {},              // { gradeName: { tappingTemp, pouringTemp, ladleTemp, pouringTime, castingWeight, runnerWeight, riserWeight, goodCastingWeight, rejectedWeight } }
        approvals: { operator: false, meltingIncharge: false, metallurgy: false, qa: false },
        savedHistoryId: null,         // heatId under which this state was last saved to History, if any

        /* ---- Ingot-specific production tracking (Ingot Calculator only; unused fields in Casting) ---- */
        ingotProduction: {}           // { gradeName: { linkedProductId, numberOfIngots, targetWeight, toleranceKg, actualWeights:[string,...] } }
      };
    }

    const state = {
      calculator: 'casting', // 'casting' | 'ingot' — controls which master data / state slice is active
      view: 'calculator',    // 'calculator' | 'history'
      casting: freshCalcState(),
      ingot: freshCalcState(),
    };
    // Seed defaults for Casting.
    state.casting.grade = castingMasterData.grades[0].name;
    state.casting.meltingRate = '14';
    // Seed defaults for Ingot (ingotMasterData now mirrors the workbook's grade/scrap tables — see
    // the provenance note above ingotMasterData — so it is usable immediately, same as Casting).
    if (ingotMasterData.grades.length) {
      state.ingot.grade = ingotMasterData.grades[0].name;
      state.ingot.meltingRate = '14';
    }

    /* ================= 5. UTILITIES ================= */
    const num = v => { const n = parseFloat(v); return isNaN(n) ? 0 : n; };
    const fmt = (n, d = 2) => (!isFinite(n) ? '0' : n.toLocaleString('en-IN', { maximumFractionDigits: d, minimumFractionDigits: 0 }));
    const fmtMoney = n => '₹' + (isFinite(n) ? n : 0).toLocaleString('en-IN', { maximumFractionDigits: 2, minimumFractionDigits: 2 });
    function esc(s) { return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
    function round(n, d) { const p = Math.pow(10, d); return Math.round(n * p) / p; }
    function uid() { return 'r' + Math.random().toString(36).slice(2, 9); }

    /* ================= 6. DATA ACCESSORS (mode-aware) ================= */
    function activeCalc() { return state.calculator; }
    function activeState() { return state[state.calculator]; }
    function activeMaster() { return masterDataFor(state.calculator); }
    function gradeNamesFor(calcName) { return masterDataFor(calcName).grades.map(g => g.name); }
    function findGrade(calcName, name) { return masterDataFor(calcName).grades.find(g => g.name === name); }
    function getSelectedGrade() { return findGrade(activeCalc(), activeState().grade); }
    function getScrapInfo(name) { return activeMaster().scrapMaterials[name]; }
    function getCompatibleScrap() { const g = getSelectedGrade(); return g ? g.compatibleScrap : []; }

    function ensureGradeState(calcName, gradeName) {
      const s = state[calcName];
      const grade = findGrade(calcName, gradeName);
      if (!grade) return;
      if (!s.target[gradeName]) {
        const t = {};
        ELEMENTS.forEach(el => {
          const { min, max } = grade.chemistry[el];
          t[el] = String(round(min + (max - min) / 2, 3));
        });
        s.target[gradeName] = t;
      }
      if (!s.oes[gradeName]) s.oes[gradeName] = {};
      if (!s.chargeRows[gradeName]) {
        s.chargeRows[gradeName] = grade.compatibleScrap.map(name => ({ id: uid(), scrap: name, qty: '' }));
      }
      if (!s.oesTwo[gradeName]) s.oesTwo[gradeName] = {};
      if (!s.corrections[gradeName]) s.corrections[gradeName] = [];
      if (!s.residualElements[gradeName]) s.residualElements[gradeName] = [];
      if (!s.residualLimits[gradeName]) s.residualLimits[gradeName] = {};
      if (!s.residualActual[gradeName]) s.residualActual[gradeName] = {};
      if (!s.yieldLoss[gradeName]) s.yieldLoss[gradeName] = { chargedWeight: '', slagLoss: '', oxidationLoss: '', handlingLoss: '', pouringLoss: '', otherLoss: '', finalMetalWeight: '' };
      if (!s.processData[gradeName]) s.processData[gradeName] = { tappingTemp: '', pouringTemp: '', ladleTemp: '', pouringTime: '', castingWeight: '', runnerWeight: '', riserWeight: '', goodCastingWeight: '', rejectedWeight: '' };
      if (!s.ingotProduction[gradeName]) s.ingotProduction[gradeName] = { linkedProductId: '', numberOfIngots: '', targetWeight: '', toleranceKg: '', actualWeights: [] };
      if (!s.heat.heatId) {
        s.heat.heatId = generateHeatId();
        const now = new Date();
        s.heat.date = now.toISOString().slice(0, 10);
        s.heat.time = now.toTimeString().slice(0, 5);
      }
    }

    function targetFor(el) { const g = activeState().target[activeState().grade]; return g ? g[el] : ''; }
    function oesFor(el) { const g = activeState().oes[activeState().grade]; return g && g[el] !== undefined ? g[el] : ''; }
    function oesTwoFor(el) { const g = activeState().oesTwo[activeState().grade]; return g && g[el] !== undefined ? g[el] : ''; }
    function chargeRowsFor() { return activeState().chargeRows[activeState().grade] || []; }
    function correctionsFor() { return activeState().corrections[activeState().grade] || []; }
    function residualElementsFor() { return activeState().residualElements[activeState().grade] || []; }
    function residualLimitFor(el) { const g = activeState().residualLimits[activeState().grade]; return g && g[el] !== undefined ? g[el] : ''; }
    function residualActualFor(el) { const g = activeState().residualActual[activeState().grade]; return g && g[el] !== undefined ? g[el] : ''; }
    function yieldLossState() { return activeState().yieldLoss[activeState().grade] || {}; }
    function processDataState() { return activeState().processData[activeState().grade] || {}; }
    function ingotProductionState() { return activeState().ingotProduction[activeState().grade] || { linkedProductId: '', numberOfIngots: '', targetWeight: '', toleranceKg: '', actualWeights: [] }; }

    /* ================= 7. VALIDATION (section 26/33) ================= */
    function validateTargetChemistry(el) {
      const g = getSelectedGrade(); if (!g) return true;
      const { min, max } = g.chemistry[el];
      const t = num(targetFor(el));
      return t >= min - 1e-9 && t <= max + 1e-9;
    }
    function invalidTargetElements() { return ELEMENTS.filter(el => !validateTargetChemistry(el)); }
    function validateAllTargets() { return invalidTargetElements().length === 0; }

    function validateInputs() {
      const s = activeState();
      const warnings = [];
      if (num(s.heatSize) <= 0) warnings.push('Heat Size must be greater than 0.');
      const y = num(s.yieldPct);
      if (y <= 0 || y > 100) warnings.push('Yield % must be greater than 0 and at most 100.');
      if (num(s.sellingPrice) < 0) warnings.push('Selling Price cannot be negative.');
      if (num(s.powerRate) < 0) warnings.push('Power ₹/kg cannot be negative.');
      if (num(s.otherRate) < 0) warnings.push('Other Process ₹/kg cannot be negative.');
      return warnings;
    }

    function dataIntegrityWarning() {
      const g = getSelectedGrade(); if (!g) return false;
      // Phosphorus/Sulphur above 5% is metallurgically impossible - signals a shifted/mismapped source column.
      return g.chemistry.P.max > 5 || g.chemistry.S.max > 5;
    }

    /* ================= 8. CHEMISTRY CALCULATIONS (sections 5, 6, 13, 14) ================= */
    function calculateChemistryStatus(el) {
      const g = getSelectedGrade(); if (!g) return 'na';
      const { min, max } = g.chemistry[el];
      const v = oesFor(el);
      if (v === '' || v === undefined) return 'na'; // "ENTER OES"
      const n = num(v);
      if (n < min - 1e-9) return 'low';
      if (n > max + 1e-9) return 'high';
      return 'ok';
    }
    function statusLabel(status) { return { ok: 'OK', low: 'LOW', high: 'HIGH', na: 'ENTER OES' }[status]; }
    function statusPill(status) {
      const map = { ok: 'status-ok', low: 'status-low', high: 'status-high', na: 'status-na' };
      return `<span class="status-pill ${map[status]}">${statusLabel(status)}</span>`;
    }

    // Difference between Target and Actual OES (section 5/13).
    function calculateChemistryDeviation(el) {
      const oes = oesFor(el);
      if (oes === '') return null;
      return num(oes) - num(targetFor(el));
    }

    function getRecommendation(el) {
      const status = calculateChemistryStatus(el);
      if (status === 'na') return 'Enter OES to compare against target';
      const dev = calculateChemistryDeviation(el);
      const tol = Math.max(0.02, Math.abs(num(targetFor(el))) * 0.03);
      if (dev === null) return '—';
      if (dev < -tol) return `LOW → increase ${el} contribution`;
      if (dev > tol) return `HIGH → reduce / dilute ${el}-bearing material`;
      return 'On target';
    }

    // Weighted charge chemistry from the Charge Mix rows (section 9).
    function calculateWeightedChemistry(el) {
      if (!CHARGE_ELEMENTS.includes(el)) return null;
      let wsum = 0, qsum = 0;
      chargeRowsFor().forEach(r => {
        const q = num(r.qty); if (q <= 0 || !r.scrap) return;
        const info = getScrapInfo(r.scrap); if (!info) return;
        wsum += q * (info.chemistry[el] || 0);
        qsum += q;
      });
      return qsum > 0 ? wsum / qsum : null;
    }

    function calculateSummaryStatus(el) {
      const target = num(targetFor(el));
      const calcVal = calculateWeightedChemistry(el);
      const oesVal = oesFor(el);
      const tol = Math.max(0.02, Math.abs(target) * 0.03);
      if (oesVal !== '') {
        const devOes = num(oesVal) - target;
        if (devOes > tol) return { label: 'HIGH OES', cls: 'status-high' };
        if (devOes < -tol) return { label: 'LOW OES', cls: 'status-low' };
      }
      if (calcVal === null) return { label: 'NO CHARGE', cls: 'status-na' };
      const devCalc = calcVal - target;
      if (Math.abs(devCalc) <= tol) return { label: 'CHARGE OK', cls: 'status-ok' };
      return devCalc > 0 ? { label: 'CHARGE HIGH', cls: 'status-high' } : { label: 'CHARGE LOW', cls: 'status-low' };
    }

    /* ================= 9. CHARGE MIX / WEIGHT CALCULATIONS (sections 9, 12, 15) ================= */
    function totalChargeQty() { return chargeRowsFor().reduce((s, r) => s + num(r.qty), 0); }

    function calculateRawChargeCost() {
      let wsum = 0, qsum = 0;
      chargeRowsFor().forEach(r => {
        const q = num(r.qty); if (q <= 0 || !r.scrap) return;
        const info = getScrapInfo(r.scrap); if (!info) return;
        wsum += q * (info.rate || 0);
        qsum += q;
      });
      return qsum > 0 ? wsum / qsum : 0;
    }

    // Required Charge Weight = Heat Size ÷ (Yield ÷ 100) — section 12.
    function calculateChargeRequirement() {
      const y = num(activeState().yieldPct) / 100;
      const hs = num(activeState().heatSize);
      return y > 0 ? hs / y : 0;
    }

    /* ================= 10. AUTO-CALCULATE CHARGE — MIXTURE OPTIMIZER (section 10, 11) =================
       Solves, for the compatible scrap materials of the selected grade, the non-negative mixture
       (Σ Qi = Required Charge Weight, Qi ≥ 0) whose weighted chemistry is closest to Target Chemistry,
       using projected-gradient descent on the probability simplex (fraction space). This is a
       heuristic least-squares solver, not a guaranteed global optimum — for grades/scrap combinations
       where the target is genuinely unreachable it converges to the closest feasible mix and the UI
       reports the resulting per-element deviation, per the "closest feasible solution" requirement. */
    function projectOntoSimplex(v) {
      const n = v.length; if (n === 0) return [];
      const u = [...v].sort((a, b) => b - a);
      let cumsum = 0, rho = -1, rhoSum = 0;
      for (let i = 0; i < n; i++) {
        cumsum += u[i];
        const t = (cumsum - 1) / (i + 1);
        if (u[i] - t > 0) { rho = i; rhoSum = cumsum; }
      }
      const theta = (rhoSum - 1) / (rho + 1);
      return v.map(x => Math.max(x - theta, 0));
    }

    function calculateTargetChargeMix() {
      const compat = getCompatibleScrap();
      const materials = compat.map(name => ({ name, comp: (getScrapInfo(name) || {}).chemistry || {} }));
      const totalWeight = calculateChargeRequirement();
      const n = materials.length;
      if (n === 0 || totalWeight <= 0) return null;

      const els = CHARGE_ELEMENTS;
      const t = {};
      els.forEach(el => { t[el] = (num(targetFor(el)) || 0) / 100; });

      let f = new Array(n).fill(1 / n);
      const iters = 1200, lr = 0.35;
      for (let it = 0; it < iters; it++) {
        const calcFrac = {};
        els.forEach(el => calcFrac[el] = 0);
        for (let i = 0; i < n; i++) {
          els.forEach(el => { calcFrac[el] += f[i] * ((materials[i].comp[el] || 0) / 100); });
        }
        const grad = new Array(n).fill(0);
        for (let i = 0; i < n; i++) {
          let g = 0;
          els.forEach(el => { g += 2 * (calcFrac[el] - t[el]) * ((materials[i].comp[el] || 0) / 100); });
          grad[i] = g;
        }
        for (let i = 0; i < n; i++) f[i] -= lr * grad[i];
        f = projectOntoSimplex(f);
      }

      const qtyByMaterial = {};
      materials.forEach((m, i) => { qtyByMaterial[m.name] = f[i] * totalWeight; });

      const achieved = {};
      ELEMENTS.forEach(el => {
        if (!CHARGE_ELEMENTS.includes(el)) { achieved[el] = null; return; }
        let s = 0;
        materials.forEach((m, i) => { s += f[i] * (m.comp[el] || 0); });
        achieved[el] = s;
      });

      let maxDev = 0;
      els.forEach(el => {
        const dev = Math.abs((achieved[el] || 0) - (num(targetFor(el)) || 0));
        if (dev > maxDev) maxDev = dev;
      });

      return { qtyByMaterial, achieved, maxDev, exact: maxDev < 0.05, materials };
    }

    function runAutoCalculate() {
      if (!validateAllTargets()) {
        alert('Target chemistry is outside the grade specification for: ' + invalidTargetElements().join(', ') + '. Fix the Target % values before Auto Calculate can run.');
        return;
      }
      const result = calculateTargetChargeMix();
      if (!result) {
        alert('No compatible charge materials configured for this grade, or Heat Size / Yield is invalid.');
        return;
      }
      const s = activeState(), g = s.grade;
      s.chargeRows[g] = result.materials.map(m => ({ id: uid(), scrap: m.name, qty: String(round(result.qtyByMaterial[m.name], 1)) }));
      s.lastAutoNote = { exact: result.exact, maxDev: result.maxDev };
    }

    function resetChargeManual() {
      const g = getSelectedGrade(); if (!g) return;
      const s = activeState();
      s.chargeRows[s.grade] = g.compatibleScrap.map(name => ({ id: uid(), scrap: name, qty: '' }));
      s.lastAutoNote = null;
    }

    /* ================= 11. COST & PROFIT (sections 15-21, 35) =================
       Finished Cost formula preserved from the original application and EXTENDED (section 35)
       with the Alloy Addition / Correction cost, on the same ₹/kg-of-charge basis as Raw Charge
       Cost, before the yield adjustment:
       Finished Cost/kg = (Raw Charge Cost + Correction Cost + Melting + Power + Other) ÷ (Yield % ÷ 100).
       When no corrections have been applied, calculateCorrectionCostPerChargeKg() is 0 and the
       formula is numerically identical to the original. */
    function calculateFinishedCost() {
      const s = activeState();
      const yieldFrac = num(s.yieldPct) / 100;
      const sumCosts = calculateRawChargeCost() + calculateCorrectionCostPerChargeKg() + num(s.meltingRate) + num(s.powerRate) + num(s.otherRate);
      return yieldFrac > 0 ? sumCosts / yieldFrac : 0;
    }
    function calculateProfit() { return num(activeState().sellingPrice) - calculateFinishedCost(); }
    function calculateProfitPercentage() { const fc = calculateFinishedCost(); return fc > 0 ? (calculateProfit() / fc * 100) : 0; }
    function calculateYieldImpact() {
      const s = activeState();
      const sumCosts = calculateRawChargeCost() + calculateCorrectionCostPerChargeKg() + num(s.meltingRate) + num(s.powerRate) + num(s.otherRate);
      return calculateFinishedCost() - sumCosts;
    }

    /* ================= 12. RESET (section 31) ================= */
    function resetCalculator(calcName) {
      state[calcName] = freshCalcState();
      if (calcName === 'casting' && castingMasterData.grades.length) {
        state.casting.grade = castingMasterData.grades[0].name;
        state.casting.meltingRate = '14';
      }
      if (calcName === 'ingot' && ingotMasterData.grades.length) {
        state.ingot.grade = ingotMasterData.grades[0].name;
        state.ingot.meltingRate = '14';
      }
    }

    /* ================= 12b. AIM / TARGET SOURCE (sections 12, 13) =================
       The workbook only supplies Min/Max, not a separate AIM column, so per the No-Fabrication
       Policy the default AIM is the grade midpoint, explicitly labelled PLANNING AIM. A user can
       mark the currently entered Target as a Customer Approved AIM (plant-entered data, Level 3
       in the source-of-truth hierarchy) — this never rewrites grade master data. */
    function aimSource() { return activeState().customerAimApproved ? 'CUSTOMER SPEC' : 'PLANNING AIM'; }

    /* ================= 12c. HEAT / BATH WEIGHT (sections 9, 19) ================= */
    function bathWeightForCorrection() {
      const yl = yieldLossState();
      const charged = num(yl.chargedWeight);
      if (charged > 0) return charged;
      const totalQty = totalChargeQty();
      if (totalQty > 0) return totalQty;
      return calculateChargeRequirement();
    }

    /* ================= 12d. CORRECTION ENGINE (sections 16-21) =================
       For each element with an OES-1 reading, computes deficit/excess vs AIM and, ONLY using
       configured Alloy Addition Master data or configured scrap-chemistry data (never invented
       values), a mathematically traceable recommended correction. */
    function findLowElementAdditions(el) {
      return alloyAdditionMaster.filter(a => a.active !== false && num(a.chemistry[el]) > 0);
    }
    function calcAdditionQtyForElement(addition, el, deficitPts, bathWeight) {
      const conc = num(addition.chemistry[el]);
      const recov = num(addition.recovery[el]);
      if (!(conc > 0)) return { error: `NOT CONFIGURED — "${addition.name}" has no configured ${el} content.` };
      if (!(recov > 0)) return { error: `ENTER PLANT DATA — recovery % for ${el} in "${addition.name}" is not configured.` };
      if (!(bathWeight > 0)) return { error: 'ENTER PLANT DATA — bath/charge weight is not available for this heat.' };
      const qty = (bathWeight * (deficitPts / 100)) / ((conc / 100) * (recov / 100));
      return { qty, conc, recov };
    }
    function findDiluentForElement(el, aimVal) {
      const master = activeMaster().scrapMaterials || {};
      const candidates = Object.entries(master)
        .filter(([name, info]) => info.chemistry && info.chemistry[el] !== undefined && info.chemistry[el] < aimVal)
        .map(([name, info]) => ({ name, conc: info.chemistry[el], rate: info.rate || 0 }));
      if (!candidates.length) return null;
      candidates.sort((a, b) => a.conc - b.conc);
      return candidates[0];
    }
    function calcDilutionQty(bathWeight, currentVal, aimVal, diluentConc) {
      const denom = aimVal - diluentConc;
      if (denom <= 1e-9) return null;
      const m = bathWeight * (currentVal - aimVal) / denom;
      return m > 0 ? m : null;
    }
    function buildCorrectionPlan() {
      const g = getSelectedGrade(); if (!g) return [];
      const bathWeight = bathWeightForCorrection();
      return ELEMENTS.map(el => {
        const oesVal = oesFor(el);
        const { min, max } = g.chemistry[el];
        const aim = num(targetFor(el));
        if (oesVal === '') return { el, status: 'NOT ENTERED', min, max, aim };
        const actual = num(oesVal);
        const deficit = round(aim - actual, 4); // +ve => below AIM, needs addition
        const tol = Math.max(0.02, Math.abs(aim) * 0.03);
        if (Math.abs(deficit) <= tol) {
          return { el, status: 'OK', actual, aim, min, max, deficit };
        }
        if (deficit > 0) {
          const candidates = findLowElementAdditions(el);
          if (!candidates.length) {
            return {
              el, status: 'LOW', actual, aim, min, max, deficit, recTag: 'NOT CONFIGURED',
              detail: `No alloy addition in the Alloy Addition Master is configured with ${el} content. Add one under Master Data → Alloy Additions.`
            };
          }
          const addition = candidates[0];
          const calc = calcAdditionQtyForElement(addition, el, deficit, bathWeight);
          if (calc.error) {
            return { el, status: 'LOW', actual, aim, min, max, deficit, recTag: 'DATA REQUIRED', detail: calc.error, addition };
          }
          const expectedAfter = actual + (calc.qty * (calc.conc / 100) * (calc.recov / 100) / bathWeight) * 100;
          return {
            el, status: 'LOW', actual, aim, min, max, deficit, recTag: addition.name, addition,
            qty: calc.qty, bathWeight, expectedAfter, conc: calc.conc, recov: calc.recov
          };
        } else {
          if (actual > max + 1e-9) {
            const diluent = findDiluentForElement(el, aim);
            if (diluent) {
              const qty = calcDilutionQty(bathWeight, actual, aim, diluent.conc);
              if (qty) {
                const expectedAfter = (bathWeight * actual + qty * diluent.conc) / (bathWeight + qty);
                return {
                  el, status: 'HIGH', actual, aim, min, max, deficit, classification: 'DILUTION REQUIRED',
                  diluent, qty, expectedAfter, bathWeight
                };
              }
            }
            return {
              el, status: 'HIGH', actual, aim, min, max, deficit, classification: 'NO DIRECT CORRECTION AVAILABLE',
              detail: `No configured material has a lower ${el}% than the current bath. Consider an alternative charge, or HOLD the heat.`
            };
          }
          return {
            el, status: 'HIGH', actual, aim, min, max, deficit, classification: 'ALTERNATIVE CHARGE REQUIRED',
            detail: `${el} is above AIM but still within grade Min/Max. Correction is optional — monitor at OES-2.`
          };
        }
      });
    }
    function simulateAfterCorrections() {
      const bathWeight = bathWeightForCorrection();
      const result = {};
      ELEMENTS.forEach(el => {
        const oesVal = oesFor(el);
        result[el] = oesVal === '' ? null : num(oesVal);
      });
      correctionsFor().forEach(c => {
        const addition = alloyAdditionMaster.find(a => a.id === c.additionId);
        const qty = num(c.qty);
        if (!addition || qty <= 0 || !(bathWeight > 0)) return;
        ELEMENTS.forEach(el => {
          if (result[el] === null) return;
          const conc = num(addition.chemistry[el]);
          const recov = num(addition.recovery[el]);
          if (conc > 0 && recov > 0) {
            result[el] += (qty * (conc / 100) * (recov / 100) / bathWeight) * 100;
          }
        });
      });
      return result;
    }
    function correctionConflicts() {
      // A "CORRECTION CONFLICT" (section 20) is a NEW out-of-range condition caused by an
      // applied addition's secondary elements — not an element that was already outside its
      // Min/Max before any correction was applied (that's simply an existing LOW/HIGH reading,
      // already surfaced by the OES-1 status pill, and correcting it is the whole point).
      const g = getSelectedGrade(); if (!g) return [];
      const sim = simulateAfterCorrections();
      const conflicts = [];
      ELEMENTS.forEach(el => {
        const v = sim[el]; if (v === null || v === undefined) return;
        const preStatus = calculateChemistryStatus(el); // status from OES-1, before corrections
        if (preStatus !== 'ok') return; // already a known deviation — not a NEW conflict
        const { min, max } = g.chemistry[el];
        if (v > max + 1e-9) conflicts.push({ el, value: v, limit: max, type: 'ABOVE MAX' });
        else if (v < min - 1e-9) conflicts.push({ el, value: v, limit: min, type: 'BELOW MIN' });
      });
      return conflicts;
    }
    function correctionCost() {
      let cost = 0;
      correctionsFor().forEach(c => {
        const addition = alloyAdditionMaster.find(a => a.id === c.additionId);
        if (addition) cost += num(c.qty) * num(addition.rate);
      });
      return cost;
    }
    function calculateCorrectionCostPerChargeKg() {
      const bw = bathWeightForCorrection();
      return bw > 0 ? correctionCost() / bw : 0;
    }

    /* ================= 12e. RESIDUALS (section 28) ================= */
    const RESIDUAL_CANDIDATES = ['Cu', 'Sn', 'Pb', 'As', 'Sb', 'Ti', 'Al', 'Co', 'W', 'B', 'Zn'];
    function residualStatus(el) {
      const actual = residualActualFor(el);
      const limit = residualLimitFor(el);
      if (actual === '' || actual === undefined) return 'NOT ENTERED';
      if (limit === '' || limit === undefined) return 'NO LIMIT CONFIGURED';
      return num(actual) <= num(limit) + 1e-9 ? 'OK' : 'EXCEEDS LIMIT';
    }

    /* ================= 12f. YIELD & LOSS (section 30) ================= */
    function calculateActualYield() {
      const yl = yieldLossState();
      const charged = num(yl.chargedWeight);
      const final = num(yl.finalMetalWeight);
      if (!(charged > 0) || yl.finalMetalWeight === '') return null;
      return (final / charged) * 100;
    }
    function calculateYieldVariance() {
      const actual = calculateActualYield();
      return actual === null ? null : actual - num(activeState().yieldPct);
    }

    /* ================= 12f2. INGOT WEIGHT / PRODUCTION (Ingot Calculator, sections 9-11, 26) =================
       Only meaningful in Ingot mode. Never used to overwrite Casting state or vice versa. */
    function ingotHeatIds() {
      const ip = ingotProductionState();
      const n = Math.max(0, Math.floor(num(ip.numberOfIngots)));
      const heatId = activeState().heat.heatId || '';
      return Array.from({ length: n }, (_, i) => `${heatId}-ING-${String(i + 1).padStart(3, '0')}`);
    }
    function calculateTotalTargetIngotWeight() {
      const ip = ingotProductionState();
      const n = num(ip.numberOfIngots), tw = num(ip.targetWeight);
      return (n > 0 && tw > 0) ? n * tw : null;
    }
    function calculateActualTotalIngotWeight() {
      const ip = ingotProductionState();
      if (!ip.actualWeights || !ip.actualWeights.length) return null;
      const vals = ip.actualWeights.filter(v => v !== '' && v !== undefined).map(num);
      if (!vals.length) return null;
      return vals.reduce((a, b) => a + b, 0);
    }
    function ingotWeightStatus(actual, target, toleranceKg) {
      if (actual === '' || actual === undefined) return 'NOT ENTERED';
      if (!(target > 0)) return 'NOT CONFIGURED';
      const a = num(actual);
      const variance = a - target;
      if (!(toleranceKg > 0)) return Math.abs(variance) < 1e-9 ? 'WITHIN TOLERANCE' : (variance > 0 ? 'OVERWEIGHT (NO TOLERANCE SET)' : 'UNDERWEIGHT (NO TOLERANCE SET)');
      if (Math.abs(variance) <= toleranceKg + 1e-9) return 'WITHIN TOLERANCE';
      return variance > 0 ? 'OVERWEIGHT' : 'UNDERWEIGHT';
    }
    function calculateIngotRequiredCharge() {
      // Required Charge = Required Finished Metal ÷ (Yield / 100) — reuses the same yield-basis formula
      // as calculateChargeRequirement(), but driven from the Ingot target rather than Heat Size directly.
      const target = calculateTotalTargetIngotWeight();
      const y = num(activeState().yieldPct) / 100;
      if (target === null || !(y > 0)) return null;
      return target / y;
    }

    /* ================= 12g. DATA CONFIDENCE (section 37) ================= */
    function dataConfidence() {
      let score = 0, max = 4;
      if (ELEMENTS.every(el => oesFor(el) !== '')) score++;
      if (ELEMENTS.every(el => oesTwoFor(el) !== '')) score++;
      const corr = correctionsFor();
      const correctionsWellConfigured = corr.length === 0 || corr.every(c => {
        const a = alloyAdditionMaster.find(x => x.id === c.additionId);
        return a && ELEMENTS.some(el => num(a.chemistry[el]) > 0 && num(a.recovery[el]) > 0);
      });
      if (correctionsWellConfigured) score++;
      if (validateAllTargets()) score++;
      const pct = score / max;
      if (pct >= 0.99) return 'HIGH CONFIDENCE';
      if (pct >= 0.6) return 'MEDIUM CONFIDENCE';
      if (pct > 0) return 'LOW CONFIDENCE';
      return 'INSUFFICIENT DATA';
    }

    /* ================= 12h. WARNING ENGINE (section 38) =================
       Single centralized source of every warning shown in the UI (Chemistry table, Correction
       panel and print report all read from calculateChemistryStatus / correctionConflicts /
       residualStatus directly — this just aggregates them for the Warnings panel). */
    function collectWarnings() {
      const warnings = [];
      const g = getSelectedGrade();
      if (!g) return warnings;
      if (dataIntegrityWarning()) {
        warnings.push({ sev: 'CRITICAL', text: `Master data anomaly for ${g.name}: P/S range looks physically implausible — verify the source workbook.` });
      }
      ELEMENTS.forEach(el => {
        if (!validateTargetChemistry(el)) warnings.push({ sev: 'CRITICAL', text: `AIM for ${el} is outside the grade Min/Max range.` });
        const st = calculateChemistryStatus(el);
        if (st === 'low') warnings.push({ sev: 'WARNING', text: `${el} OES-1 is LOW vs grade Min/Max.` });
        if (st === 'high') warnings.push({ sev: 'WARNING', text: `${el} OES-1 is HIGH vs grade Min/Max.` });
      });
      residualElementsFor().forEach(el => {
        if (residualStatus(el) === 'EXCEEDS LIMIT') warnings.push({ sev: 'CRITICAL', text: `Residual ${el} exceeds its configured limit.` });
      });
      correctionConflicts().forEach(c => {
        warnings.push({ sev: 'CRITICAL', text: `CORRECTION CONFLICT: simulated ${c.el} is ${c.type === 'ABOVE MAX' ? 'above maximum' : 'below minimum'} (${fmt(c.value, 3)}% vs limit ${fmt(c.limit, 3)}%) after applied corrections.` });
      });
      if (activeState().lastAutoNote && !activeState().lastAutoNote.exact) {
        warnings.push({ sev: 'WARNING', text: `Heuristic optimizer could not reach an exact chemistry match — max deviation ≈ ${fmt(activeState().lastAutoNote.maxDev, 3)}%.` });
      }
      const variance = calculateYieldVariance();
      if (variance !== null && Math.abs(variance) > 5) {
        warnings.push({ sev: 'WARNING', text: `Actual yield differs from planned yield by ${fmt(Math.abs(variance), 1)} points.` });
      }
      if (alloyAdditionMaster.length === 0 && ELEMENTS.some(el => calculateChemistryStatus(el) === 'low')) {
        warnings.push({ sev: 'INFO', text: 'Alloy Addition Master is empty, so no correction quantities can be calculated for LOW elements. Configure it under Master Data.' });
      }
      if (state.calculator === 'ingot') {
        const ip = ingotProductionState();
        const n = Math.max(0, Math.floor(num(ip.numberOfIngots)));
        if (n > 0 && !(num(ip.toleranceKg) > 0)) {
          warnings.push({ sev: 'INFO', text: 'Ingot weight tolerance is not configured — weight status will show OVERWEIGHT/UNDERWEIGHT without a tolerance band until plant data is entered.' });
        }
        ip.actualWeights.slice(0, n).forEach((v, i) => {
          const st = ingotWeightStatus(v, num(ip.targetWeight), num(ip.toleranceKg));
          if (st === 'OVERWEIGHT' || st === 'UNDERWEIGHT') warnings.push({ sev: 'WARNING', text: `Ingot ${i + 1} is ${st.toLowerCase()} vs target.` });
        });
      }
      return warnings;
    }

    /* ================= 12i. HEAT RELEASE ENGINE (section 33) ================= */
    function evaluateRelease() {
      const g = getSelectedGrade();
      const reasons = [];
      if (!g) return { ready: false, reasons: ['No grade selected.'] };
      const oes2Missing = ELEMENTS.filter(el => oesTwoFor(el) === '');
      if (oes2Missing.length) {
        reasons.push(`Final OES (OES-2) not entered for: ${oes2Missing.join(', ')}.`);
      } else {
        ELEMENTS.forEach(el => {
          const v = num(oesTwoFor(el));
          const { min, max } = g.chemistry[el];
          if (v < min - 1e-9) reasons.push(`${el} final chemistry (${fmt(v, 3)}%) is below grade minimum (${fmt(min, 3)}%).`);
          if (v > max + 1e-9) reasons.push(`${el} final chemistry (${fmt(v, 3)}%) exceeds grade maximum (${fmt(max, 3)}%).`);
        });
      }
      residualElementsFor().forEach(el => {
        if (residualStatus(el) === 'EXCEEDS LIMIT') reasons.push(`Residual ${el} exceeds its configured limit.`);
      });
      const conflicts = correctionConflicts();
      if (conflicts.length) reasons.push(`Unresolved correction conflict on: ${conflicts.map(c => c.el).join(', ')}.`);
      if (calculateActualYield() === null) reasons.push('Actual yield not calculated — enter Charged Weight and Final Metal Weight in Yield & Loss.');
      if (state.calculator === 'ingot') {
        const ip = ingotProductionState();
        const n = Math.max(0, Math.floor(num(ip.numberOfIngots)));
        if (n > 0) {
          const missingWeights = ip.actualWeights.filter((v, i) => i < n && (v === '' || v === undefined)).length;
          if (missingWeights > 0) reasons.push(`${missingWeights} ingot(s) are missing an actual weight entry.`);
          const outOfTolerance = ip.actualWeights.slice(0, n).filter(v => v !== '' && ['OVERWEIGHT', 'UNDERWEIGHT'].includes(ingotWeightStatus(v, num(ip.targetWeight), num(ip.toleranceKg)))).length;
          if (outOfTolerance > 0) reasons.push(`${outOfTolerance} ingot(s) are outside the configured weight tolerance.`);
        }
      }
      return { ready: reasons.length === 0, reasons };
    }

    /* ================= 12j. HEAT STATUS (section 11) =================
       Derived only from actual heat conditions — never settable directly by a button click. */
    function deriveHeatStatus() {
      const hasCharge = totalChargeQty() > 0;
      if (!hasCharge) return 'DRAFT';
      const oes1Complete = ELEMENTS.every(el => oesFor(el) !== '');
      if (!oes1Complete) return 'CHARGE PLANNED';
      const oes1AllOk = ELEMENTS.every(el => calculateChemistryStatus(el) === 'ok');
      const oes2Complete = ELEMENTS.every(el => oesTwoFor(el) !== '');
      if (!oes1AllOk && correctionsFor().length === 0 && !oes2Complete) return 'CORRECTION REQUIRED';
      if (!oes2Complete) return 'OES-2 PENDING';
      const rel = evaluateRelease();
      if (!rel.ready) return 'HOLD';
      const allApproved = Object.values(activeState().approvals).every(Boolean);
      return allApproved ? 'RELEASED' : 'READY FOR RELEASE';
    }
    function heatStatusCssClass(status) { return 'hs-' + status.replace(/[\s/]/g, '-'); }

    /* ================= 12k. HEAT HISTORY ACTIONS (section 36) ================= */
    function snapshotHeat() {
      const s = activeState();
      const g = getSelectedGrade();
      return {
        heatId: s.heat.heatId,
        calculator: state.calculator,
        grade: s.grade,
        gradeName: g ? g.name : s.grade,
        savedAt: new Date().toISOString(),
        status: deriveHeatStatus(),
        dataConfidence: dataConfidence(),
        heat: JSON.parse(JSON.stringify(s.heat)),
        heatSize: s.heatSize, yieldPct: s.yieldPct,
        target: JSON.parse(JSON.stringify(s.target[s.grade] || {})),
        oes: JSON.parse(JSON.stringify(s.oes[s.grade] || {})),
        oesTwo: JSON.parse(JSON.stringify(s.oesTwo[s.grade] || {})),
        chargeRows: JSON.parse(JSON.stringify(s.chargeRows[s.grade] || [])),
        corrections: JSON.parse(JSON.stringify(s.corrections[s.grade] || [])),
        residualElements: JSON.parse(JSON.stringify(s.residualElements[s.grade] || [])),
        residualLimits: JSON.parse(JSON.stringify(s.residualLimits[s.grade] || {})),
        residualActual: JSON.parse(JSON.stringify(s.residualActual[s.grade] || {})),
        yieldLoss: JSON.parse(JSON.stringify(s.yieldLoss[s.grade] || {})),
        processData: JSON.parse(JSON.stringify(s.processData[s.grade] || {})),
        approvals: JSON.parse(JSON.stringify(s.approvals)),
        ingotProduction: JSON.parse(JSON.stringify(s.ingotProduction[s.grade] || {})),
        finishedCost: calculateFinishedCost(),
        profitPct: calculateProfitPercentage(),
        schemaVersion: HISTORY_SCHEMA_VERSION
      };
    }
    function saveCurrentHeatToHistory() {
      const snap = snapshotHeat();

      activeState().savedHistoryId = snap.heatId;

      s.grade = snap.grade;
      delete backend.linkedHeatId[state.calculator + '|' + s.grade];
      s.heat = JSON.parse(JSON.stringify(snap.heat));
      s.heat = JSON.parse(JSON.stringify(snap.heat));
      s.heatSize = snap.heatSize; s.yieldPct = snap.yieldPct;
      s.target[s.grade] = JSON.parse(JSON.stringify(snap.target));
