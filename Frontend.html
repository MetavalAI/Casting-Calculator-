        return apiFetch('/employees/' + encodeURIComponent(id), {
          method: 'PATCH',
          body: JSON.stringify({ active })
        });
      },

      async deleteEmployee(id) {
        return apiFetch('/employees/' + encodeURIComponent(id), { method: 'DELETE' });
      },

      async changePassword(userId, isAdmin, newPassword) {
        if (String(newPassword || '').length < 8) throw new Error('Password must be at least 8 characters.');
        return apiFetch('/auth/change-password', {
          method: 'POST',
          body: JSON.stringify({ password: newPassword })
        });
      },

      async getMessages({ mode, peerId }) {
        const query = '/chat/messages?mode=' + encodeURIComponent(mode) +
          (mode === 'private' ? '&peer=' + encodeURIComponent(peerId || '') : '');
        const rows = await apiFetch(query);
        return rows.map(m => ({
          id: m.id,
          senderId: m.sender_id,
          senderName: m.sender_name,
          recipientId: m.recipient_id,
          text: m.text,
          mode: m.mode,
          createdAt: m.created_at
        }));
      },

      async sendMessage({ mode, text, recipientId }) {
        return apiFetch('/chat/messages', {
          method: 'POST',
          body: JSON.stringify({ mode, text, recipientId: recipientId || null })
        });
      }
    };

    let session = null;
    function restoreSession() {
      try { session = JSON.parse(localStorage.getItem(AUTH_KEYS.SESSION) || 'null'); } catch (e) { session = null; }
      return session;
    }
    function persistSession(user) { session = user; localStorage.setItem(AUTH_KEYS.SESSION, JSON.stringify(user)); }
    function clearSession() { session = null; localStorage.removeItem(AUTH_KEYS.SESSION); }

    /* ---- "Team Members" admin panel (create / list / deactivate / delete employees) ---- */
    function renderEmployeeAdmin() {
      const employees = window.__mvEmployeesCache || [];
      const rows = employees.map(e => `
    <tr>
      <td><span class="status-dot ${e.active ? 'on' : 'off'}"></span>${esc(e.name)}</td>
      <td>${esc(e.email)}</td>
      <td>${esc(e.department || '—')}</td>
      <td><span class="role-pill employee">${esc(String(e.role || 'employee').replace(/_/g, ' ').toUpperCase())}</span></td>
      <td>${e.active ? 'Active' : 'Deactivated'}</td>
      <td>
        <button class="btn btn-sm" data-action="toggleEmployeeActive" data-emp="${esc(e.id)}" data-active="${e.active}">${e.active ? 'Deactivate' : 'Activate'}</button>
        <button class="btn btn-sm" data-action="deleteEmployee" data-emp="${esc(e.id)}" data-name="${esc(e.name)}">Delete</button>
      </td>
    </tr>`).join('') || '<tr><td colspan="6" style="color:#888;">No employees added yet.</td></tr>';

      return `
  <div class="panel">
    <div class="panel-title"><span class="ti">${ICONS.settings}Team Members (Admin)</span></div>
    <div class="local-only-banner" style="background:var(--good-dim);border-color:var(--good);color:var(--text-dim);">SERVER DATA — employee accounts are stored by the Node/Express backend. Passwords are hashed with bcrypt and are never stored in this browser.</div>
    <div class="subsection-title">Create Employee</div>
    <div class="emp-form-grid">
      <div class="field"><label>Full Name</label><input id="empNewName" type="text" placeholder="e.g. Priya Sharma" autocomplete="off"></div>
      <div class="field"><label>Work Email</label><input id="empNewEmail" type="email" placeholder="name@metaval.com" autocomplete="off"></div>
      <div class="field"><label>Temporary Password</label><input id="empNewPassword" type="password" placeholder="min. 8 characters" autocomplete="new-password"></div>
      <div class="field"><label>Role</label><select id="empNewRole">
        <option value="employee">Employee</option>
        <option value="operator">Operator</option>
        <option value="melting_incharge">Melting In-Charge</option>
        <option value="metallurgist">Metallurgist</option>
        <option value="qa">QA</option>
      </select></div>
      <div class="field"><label>Department</label><select id="empNewDept">
        <option value="Casting">Casting</option>
        <option value="Ingot">Ingot</option>
        <option value="Casting & Ingot">Casting &amp; Ingot</option>
        <option value="IT / Engineering">IT / Engineering</option>
      </select></div>
    </div>
    <button class="btn btn-accent" data-action="createEmployeeSubmit">Create Employee</button>
    <div id="empFormMessage" style="margin-top:8px;font-size:12px;" aria-live="polite"></div>
    <div class="subsection-title" style="margin-top:20px;">Existing Employees</div>
    <table class="dtable emp-table">
      <thead><tr><th>Name</th><th>Email</th><th>Department</th><th>Role</th><th>Status</th><th>Actions</th></tr></thead>
      <tbody>${rows}</tbody>
    </table>
  </div>`;
    }

    // The employee table above is built from a small in-memory cache (window.__mvEmployeesCache)
    // that we refresh whenever the admin panel needs to render, since MetavalAPI methods are
    // async but render() itself is synchronous.
    async function refreshEmployeeCache() {
      if (!backend.token || !session || session.role !== 'admin') {
        window.__mvEmployeesCache = [];
        return [];
      }
      window.__mvEmployeesCache = await MetavalAPI.listEmployees();
      return window.__mvEmployeesCache;
    }

    /* ---- Internal chat (public channel + 1:1 private) ---- */
    function mountChatWidget() {
      if (document.getElementById('mvChatLaunch')) return; // already mounted

      const launch = document.createElement('button');
      launch.id = 'mvChatLaunch';
      launch.className = 'chat-launch';
      launch.title = 'Internal Team Chat';
      launch.innerHTML = '💬<span id="mvChatBadge" class="chat-unread-badge" style="display:none"></span>';
      document.body.appendChild(launch);

      const panel = document.createElement('section');
      panel.className = 'chat-panel';
      panel.id = 'mvChatPanel';
      panel.innerHTML = `
    <div class="chat-head"><b>Metaval Internal Chat</b><button id="mvChatClose" type="button" style="background:none;border:0;color:#fff;font-size:18px;cursor:pointer;">×</button></div>
    <div class="chat-banner">Local to this browser/device until a backend is connected.</div>
    <div class="chat-tools">
      <select id="mvChatMode">
        <option value="public">Public company chat</option>
        <option value="private">Private chat</option>
      </select>
      <select id="mvChatPeer" style="display:none"><option value="">Select person…</option></select>
    </div>
    <div id="mvChatBody" class="chat-body"></div>
    <div class="chat-compose">
      <input id="mvChatText" placeholder="Write a message…" autocomplete="off">
      <button id="mvChatSend" type="button">Send</button>
    </div>`;
      document.body.appendChild(panel);

      const $ = id => document.getElementById(id);
      let peer = '';
      let pollTimer = null;

      async function populatePeers() {
        const employees = await MetavalAPI.listEmployees();
        const people = employees.filter(e => e.active !== false && e.id !== session.id);
        $('mvChatPeer').innerHTML = '<option value="">Select person…</option>' +
          people.map(p => `<option value="${p.id}">${esc(p.name)}</option>`).join('');
      }

      function escapeHtml(x) {
        return String(x).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
      }

      async function loadMessages() {
        const mode = $('mvChatMode').value;
        if (mode === 'private' && !peer) {
          $('mvChatBody').innerHTML = '<div class="chat-empty">Choose a person to start a private conversation.</div>';
          return;
        }
        const rows = await MetavalAPI.getMessages({ mode, currentUserId: session.id, peerId: peer });
        $('mvChatBody').innerHTML = rows.length ? rows.map(m => `
      <div class="chat-msg ${m.senderId === session.id ? 'mine' : ''}">
        <b>${escapeHtml(m.senderName || 'Employee')}</b><br>${escapeHtml(m.text)}
        <small style="display:block;color:#918dab;margin-top:2px;">${new Date(m.createdAt).toLocaleString()}</small>
      </div>`).join('') : '<div class="chat-empty">No messages yet — say hello 👋</div>';
        $('mvChatBody').scrollTop = $('mvChatBody').scrollHeight;
      }

      launch.onclick = async () => {
        panel.classList.toggle('open');
        if (panel.classList.contains('open')) {
          $('mvChatBadge').style.display = 'none';
          await populatePeers();
          await loadMessages();
        }
      };
      $('mvChatClose').onclick = () => panel.classList.remove('open');
      $('mvChatMode').onchange = () => {
        $('mvChatPeer').style.display = $('mvChatMode').value === 'private' ? 'block' : 'none';
        loadMessages();
      };
      $('mvChatPeer').onchange = e => { peer = e.target.value; loadMessages(); };
      $('mvChatSend').onclick = async () => {
        const text = $('mvChatText').value.trim();
        if (!text) return;
        const mode = $('mvChatMode').value;
        if (mode === 'private' && !peer) { alert('Choose a person first.'); return; }
        await MetavalAPI.sendMessage({ mode, text, senderId: session.id, senderName: session.name, recipientId: peer || null });
        $('mvChatText').value = '';
        loadMessages();
      };
      $('mvChatText').addEventListener('keydown', e => { if (e.key === 'Enter') $('mvChatSend').click(); });

      // Lightweight polling so messages sent from another tab/session on the same
      // browser show up without a manual refresh. A real backend would replace this
      // with a websocket/SSE push instead of polling localStorage.
      pollTimer = setInterval(() => { if (panel.classList.contains('open')) loadMessages(); }, 4000);
    }

    /* ---- Login gate wiring ---- */
    const mvGate = document.getElementById('metavalLoginGate');
    const mvLoginForm = document.getElementById('metavalUnifiedLogin');
    const mvLoginMessage = document.getElementById('mvLoginMessage');
    const mvAuthBar = document.getElementById('mvAuthBar');
    const mvSignedIn = document.getElementById('mvSignedIn');

    async function showApp() {
      mvGate.hidden = true;
      mvAuthBar.style.display = 'flex';
      mvSignedIn.textContent = 'Signed in: ' + session.name + ' · ' + session.role.toUpperCase();
      await refreshEmployeeCache();
      render();
      mountChatWidget();
    }
    function showGate() {
      mvGate.hidden = false;
      mvAuthBar.style.display = 'none';
    }

    mvLoginForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('mvEmail').value;
      const password = document.getElementById('mvPassword').value;
      const user = await MetavalAPI.login(email, password);
      if (!user) { mvLoginMessage.textContent = 'Invalid credentials or inactive employee account.'; return; }
      mvLoginMessage.textContent = '';
      persistSession(user);
      showApp();
    });

    document.getElementById('mvLogout').addEventListener('click', () => {
      backendLogout();
      clearSession();
      location.reload();
    });

    document.getElementById('mvChangePassword').addEventListener('click', async () => {
      const next = prompt('Enter a new password (minimum 8 characters):');
      if (next === null) return;
      try {
        await MetavalAPI.changePassword(session.id, session.role === 'admin', next);
        alert('Password updated successfully.');
      } catch (err) { alert(err.message); }
    });

    /* ================= 16. INIT ================= */
    (async function initAuth() {
      try {
        if (backend.token) {
          const me = await apiFetch('/me');
          backend.user = me.user;
          session = me.user;
          sessionStorage.setItem('metaval_user', JSON.stringify(me.user));
          localStorage.setItem(AUTH_KEYS.SESSION, JSON.stringify(me.user));
          await showApp();
          return;
        }
      } catch (_) {
        backendLogout();
        clearSession();
      }
      showGate();
    })();
  </script>
</body>

</html>
