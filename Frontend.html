    /* ================= 13. RENDER ================= */
    /* ================= 0b. BACKEND INTEGRATION BRIDGE =================
       Connects this file to the Node/Express/SQLite backend (see the Backend Build Guide).
       Core principle carried over from that guide: the backend is authoritative for anything
       that gates a release decision. This bridge does NOT silently replace the existing local
       calculation engine (kept for instant UI feedback) — it adds a visible "Backend" panel that
       lets you log in, push the current heat to the server, and verify the server's own
       correction-plan/release-check/cost against what this page computed locally. Approvals and
       the final Release action go through the server when connected, because a checkbox anyone
       can tick is not a real approval (see §6 of the guide).
       Works with zero configuration if nothing is running at API_BASE: every button simply shows
       a clear "Backend not reachable" message and the app keeps working exactly as before. */
    const backend = {
      apiBase: (window.METAVAL_API_BASE || 'http://localhost:4000/api'),
      token: sessionStorage.getItem('metaval_token') || null,
      user: JSON.parse(sessionStorage.getItem('metaval_user') || 'null'),
      linkedHeatId: {}, // { 'casting|CAST IRON|HT-2026-00001': true } - which local heats have been pushed
      lastServerCheck: null, // { correctionPlan, releaseCheck, cost, fetchedAt } for the Verify panel
      lastError: null,
    };

    async function apiFetch(path, opts) {
      opts = opts || {};
      const headers = Object.assign({ 'Content-Type': 'application/json' }, opts.headers || {});
      if (backend.token) headers['Authorization'] = 'Bearer ' + backend.token;
      let res;
      try {
        res = await fetch(backend.apiBase + path, Object.assign({}, opts, { headers }));
      } catch (e) {
        throw new Error('Backend not reachable at ' + backend.apiBase + ' — is it running? (' + e.message + ')');
      }
      let body = null;
      try { body = await res.json(); } catch (e) { /* no body */ }
      if (!res.ok) {
        const msg = (body && (body.message || body.error)) || ('HTTP ' + res.status);
        const err = new Error(msg);
        err.status = res.status;
        err.body = body;
        throw err;
      }
      return body;
    }
    async function backendLogin(email, password) {
      const data = await apiFetch('/auth/login', {
        method: 'POST',
        body: JSON.stringify({
          email: String(email || '').trim(),
          password: String(password || '')
        })
      });
      backend.token = data.accessToken || data.token || null;
      backend.user = data.user || null;
      if (!backend.token || !backend.user) throw new Error('Login response did not contain a valid session.');
      sessionStorage.setItem('metaval_token', backend.token);
      sessionStorage.setItem('metaval_user', JSON.stringify(backend.user));
      persistSession(backend.user);
      return data;
    }

    function backendLogout() {
      backend.token = null; backend.user = null;
      sessionStorage.removeItem('metaval_token'); sessionStorage.removeItem('metaval_user');
    }

    /** Push the ENTIRE current local heat (identification is skipped — the backend tracks its own
     *  operator/customer/etc. via PATCH separately if desired) to the backend: creates the heat on
     *  first push, then syncs targets, charge rows, OES-1/OES-2, corrections and yield-loss. The
     *  server's own sequential Heat ID becomes authoritative once linked (guide §6: "Heat IDs must
     *  come from a DB sequence, not client-generated"). */
    async function pushHeatToBackend() {
      const s = activeState();
      const g = getSelectedGrade();
      if (!g) throw new Error('No grade selected.');
      const linkKey = state.calculator + '|' + s.grade;
      let heatId = backend.linkedHeatId[linkKey];

      if (!heatId) {
        const created = await apiFetch('/heats', { method: 'POST', body: JSON.stringify({ calculator: state.calculator, gradeName: g.name }) });
        // Accepts either the Node backend's snake_case DB-row passthrough (heat_id) or the .NET
        // backend's idiomatic camelCase (heatId) — this bridge works unmodified against either.
        heatId = created.heat_id || created.heatId;
        backend.linkedHeatId[linkKey] = heatId;
        // Server-generated ID becomes the heat's real identity from here on.
        s.heat.heatId = heatId;
      }

      const targets = {};
      ELEMENTS.forEach(el => { targets[el] = num(targetFor(el)); });
      await apiFetch('/heats/' + heatId + '/targets', { method: 'PUT', body: JSON.stringify({ targets }) });

      const rows = chargeRowsFor().filter(r => num(r.qty) > 0).map(r => ({ scrapName: r.scrap, qtyKg: num(r.qty), pricePerKg: getScrapInfo(r.scrap)?.rate ?? null }));
      await apiFetch('/heats/' + heatId + '/charge-rows', { method: 'PUT', body: JSON.stringify({ rows }) });

      const oes1 = {}; ELEMENTS.forEach(el => { if (oesFor(el) !== '') oes1[el] = num(oesFor(el)); });
      if (Object.keys(oes1).length) await apiFetch('/heats/' + heatId + '/oes', { method: 'POST', body: JSON.stringify({ stage: 'oes1', readings: oes1 }) });

      const oes2 = {}; ELEMENTS.forEach(el => { if (oesTwoFor(el) !== '') oes2[el] = num(oesTwoFor(el)); });
      if (Object.keys(oes2).length) await apiFetch('/heats/' + heatId + '/oes', { method: 'POST', body: JSON.stringify({ stage: 'oes2', readings: oes2 }) });

      const yl = yieldLossState();
      await apiFetch('/heats/' + heatId + '/yield-loss', {
        method: 'PATCH', body: JSON.stringify({
          chargedWeightKg: yl.chargedWeight !== '' ? num(yl.chargedWeight) : null,
          finalMetalWeightKg: yl.finalMetalWeight !== '' ? num(yl.finalMetalWeight) : null,
        })
      });

      const residuals = residualElementsFor().map(el => ({ element: el, actualPct: residualActualFor(el) !== '' ? num(residualActualFor(el)) : null, limitPct: residualLimitFor(el) !== '' ? num(residualLimitFor(el)) : null }));
      if (residuals.length) await apiFetch('/heats/' + heatId + '/residuals', { method: 'PUT', body: JSON.stringify({ residuals }) });
      await apiFetch('/heats/' + heatId + '/info', {
        method: 'PUT', body: JSON.stringify({
          info: {
            heat: s.heat, heatSize: s.heatSize, yieldPct: s.yieldPct,
            meltingRate: s.meltingRate, powerRate: s.powerRate, otherRate: s.otherRate, sellingPrice: s.sellingPrice,
            corrections: s.corrections[s.grade] || [], processData: s.processData[s.grade] || {},
            yieldLoss: s.yieldLoss[s.grade] || {}, ingotProduction: s.ingotProduction[s.grade] || {}
          }
        })
      });
      return heatId;
    }

    /** Fetch the server's own correction-plan / release-check / cost for the linked heat, so the
     *  UI can show "server agrees" or "server disagrees" next to the local numbers — this is the
     *  guide's core non-negotiable made visible, not just a backend implementation detail. */
    async function verifyWithBackend() {
      const s = activeState();
      const linkKey = state.calculator + '|' + s.grade;
      const heatId = backend.linkedHeatId[linkKey];
      if (!heatId) throw new Error('Push this heat to the backend first.');
      const [correctionPlan, releaseCheck, cost, statusResp] = await Promise.all([
        apiFetch('/heats/' + heatId + '/correction-plan'),
        apiFetch('/heats/' + heatId + '/release-check'),
        apiFetch('/heats/' + heatId + '/cost'),
        apiFetch('/heats/' + heatId + '/status'),
      ]);
      backend.lastServerCheck = { correctionPlan, releaseCheck, cost, statusResp, fetchedAt: new Date() };
    }

    async function backendApprove(role) {
      const s = activeState();
      const linkKey = state.calculator + '|' + s.grade;
      const heatId = backend.linkedHeatId[linkKey];
      if (!heatId) throw new Error('Push this heat to the backend first.');
      await apiFetch('/heats/' + heatId + '/approvals', { method: 'POST', body: JSON.stringify({ role }) });
    }

    async function backendRelease() {
      const s = activeState();
      const linkKey = state.calculator + '|' + s.grade;
      const heatId = backend.linkedHeatId[linkKey];
      if (!heatId) throw new Error('Push this heat to the backend first.');
      return apiFetch('/heats/' + heatId + '/release', { method: 'POST' });
    }

      <td class="num">${calcVal !== null ? fmt(calcVal, 3) + '%' : '<span style="color:var(--text-mute)">—</span>'}</td>
      <td class="num">${oesVal !== '' ? fmt(num(oesVal), 3) + '%' : '<span style="color:var(--text-mute)">—</span>'}</td>
      <td class="${devCalc === null ? 'num' : (devCalc < 0 ? 'dev-neg' : 'dev-pos')}">${devCalc === null ? '—' : (devCalc > 0 ? '+' : '') + fmt(devCalc, 3)}</td>
      <td><span class="status-pill ${st.cls}">${st.label}</span></td>
    </tr>`;
      }).join('');
      return `
  <div class="panel">
    <div class="panel-title"><span class="ti">${ICONS.list}Charge Mix Chemistry Summary</span></div>
    <div class="panel-sub">Calculated Charge = weighted chemistry from the Charge Mix quantities above. Compare it against Target and against the Actual OES reading.</div>
    <table class="dtable">
      <thead><tr><th>Element</th><th>Target %</th><th>Calculated Charge %</th><th>Actual OES %</th><th>Deviation (Charge − Target)</th><th>Status</th></tr></thead>
      <tbody>${rows}</tbody>
    </table>
  </div>`;
    }

    function renderCalcDetails() {
      const s = activeState();
      const rowsHTML = chargeRowsFor().filter(r => num(r.qty) > 0).map(r => {
        const info = getScrapInfo(r.scrap) || { rate: 0 };
        const cost = num(r.qty) * (info.rate || 0);
        return `<div class="cd-line"><span>${esc(r.scrap)}: ${fmt(num(r.qty), 0)} kg × ₹${fmt(info.rate || 0, 0)}/kg</span><b>₹${fmt(cost, 2)}</b></div>`;
      }).join('') || '<div class="cd-line"><span>No charge quantities entered</span><b>—</b></div>';
      return `
  <div class="calc-details-box">
    <div class="cd-line"><span>Heat Size</span><b>${fmt(num(s.heatSize), 0)} kg</b></div>
    <div class="cd-line"><span>Yield</span><b>${fmt(num(s.yieldPct), 1)}%</b></div>
    <div class="cd-line"><span>Required Charge Weight</span><b>${fmt(calculateChargeRequirement(), 2)} kg</b></div>
    ${rowsHTML}
    <div class="cd-line"><span>Total Charge</span><b>${fmt(totalChargeQty(), 2)} kg</b></div>
    <div class="cd-line"><span>Weighted Raw Charge Cost</span><b>₹${fmt(calculateRawChargeCost(), 2)}/kg</b></div>
  </div>`;
    }

    function renderCostProfit() {
      const s = activeState();
      const raw = calculateRawChargeCost();
      const fin = calculateFinishedCost();
      const profit = calculateProfit();
      const pct = calculateProfitPercentage();
      const yImpact = calculateYieldImpact();
      return `
  <div class="panel">
    <div class="panel-title">
      <span class="ti">${ICONS.coin}Cost &amp; Profit</span>
      <button class="details-toggle" data-action="toggleDetails">${s.showDetails ? 'Hide calculation details' : 'View calculation details'}</button>
    </div>
    <div class="cost-grid">
      <div class="cost-card">
        <div class="lbl">Raw Charge Cost/kg</div>
        <div class="val">${fmtMoney(raw)}</div>
      </div>
      <div class="cost-card">
        <div class="lbl">Melting Cost/kg</div>
        <div class="val">${fmtMoney(num(s.meltingRate))}</div>
      </div>
      <div class="cost-card editable">
        <div class="lbl">Power ₹/kg</div>
        <input type="number" min="0" step="0.5" data-action="powerRate" value="${esc(s.powerRate)}" />
      </div>
      <div class="cost-card editable">
        <div class="lbl">Other Process ₹/kg</div>
        <input type="number" min="0" step="0.5" data-action="otherRate" value="${esc(s.otherRate)}" />
      </div>
      <div class="cost-card">
        <div class="lbl">Yield Impact ₹/kg</div>
        <div class="val">${fmtMoney(yImpact)}</div>
      </div>
      <div class="cost-card highlight">
        <div class="lbl">Finished Cost/kg (yield-adjusted)</div>
        <div class="val">${fmtMoney(fin)}</div>
      </div>
      <div class="cost-card editable">
        <div class="lbl">Selling Price/kg</div>
        <input type="number" min="0" step="0.5" data-action="sellingPrice" value="${esc(s.sellingPrice)}" />
      </div>
      <div class="cost-card ${profit >= 0 ? 'profit-pos' : 'profit-neg'}">
        <div class="lbl">Profit/kg</div>
        <div class="val">${fmtMoney(profit)}</div>
      </div>
      <div class="cost-card ${pct >= 0 ? 'profit-pos' : 'profit-neg'}">
        <div class="lbl">Profit %</div>
        <div class="val">${fmt(pct, 1)}%</div>
      </div>
    </div>
    <div class="note">Finished Cost/kg = (Raw Charge Cost + Melting + Power + Other) ÷ (Yield % ÷ 100). Yield Impact/kg = Finished Cost − (Raw + Melting + Power + Other).</div>
    ${s.showDetails ? renderCalcDetails() : ''}
  </div>`;
    }

    /* ================= 13b. HEAT DASHBOARD (section 41) ================= */
    function renderHeatDashboard() {
      const g = getSelectedGrade();
      const s = activeState();
      const status = deriveHeatStatus();
      const conf = dataConfidence();
      const confClass = 'conf-' + conf.split(' ')[0];
      const chemAllOk = ELEMENTS.every(el => calculateChemistryStatus(el) === 'ok');
      const chemAnyEntered = ELEMENTS.some(el => oesFor(el) !== '');
      const corrNeeded = ELEMENTS.some(el => calculateChemistryStatus(el) !== 'ok') && chemAnyEntered;
      return `
  <div class="panel">
    <div class="panel-title"><span class="ti">${ICONS.gauge}Heat Dashboard</span>
      <span class="heat-status-pill ${heatStatusCssClass(status)}">${esc(status)}</span>
    </div>
    <div class="dash-grid">
      <div class="dash-card"><div class="lbl">Heat ID</div><div class="val">${esc(s.heat.heatId || '—')}</div></div>
      <div class="dash-card"><div class="lbl">Grade</div><div class="val">${esc(g ? g.name : '—')}</div></div>
      <div class="dash-card"><div class="lbl">Heat Size</div><div class="val">${fmt(num(s.heatSize), 0)} kg</div></div>
      <div class="dash-card"><div class="lbl">Charge Weight</div><div class="val">${fmt(totalChargeQty(), 0)} kg</div></div>
      <div class="dash-card"><div class="lbl">OES-1 Status</div><div class="val">${chemAnyEntered ? (chemAllOk ? 'ALL OK' : 'DEVIATION') : 'NOT ENTERED'}</div></div>
      <div class="dash-card"><div class="lbl">Correction</div><div class="val">${corrNeeded ? (correctionsFor().length ? `${correctionsFor().length} APPLIED` : 'REQUIRED') : (chemAnyEntered ? 'NOT NEEDED' : '—')}</div></div>
      <div class="dash-card"><div class="lbl">Actual Yield</div><div class="val">${calculateActualYield() === null ? '—' : fmt(calculateActualYield(), 1) + '%'}</div></div>
      <div class="dash-card"><div class="lbl">Cost/kg</div><div class="val">${fmtMoney(calculateFinishedCost())}</div></div>
      <div class="dash-card"><div class="lbl">Data Confidence</div><div class="val ${confClass}">${conf}</div></div>
      <div class="dash-card"><div class="lbl">Release Status</div><div class="val">${status === 'RELEASED' ? 'RELEASED' : (status === 'READY FOR RELEASE' ? 'READY' : (status === 'HOLD' ? 'HOLD' : 'PENDING'))}</div></div>
    </div>
  </div>`;
    }

    /* ================= 13c. HEAT IDENTIFICATION / SPECIFICATION (sections 9, 32) ================= */
    function heatField(label, action, value, placeholder) {
      return `<div class="field"><label>${esc(label)}</label><input type="text" data-action="${action}" value="${esc(value || '')}" placeholder="${esc(placeholder || '')}" /></div>`;
    }
    function renderHeatIdentification() {
      const h = activeState().heat;
      return `
  <div class="panel">
    <div class="panel-title"><span class="ti">${ICONS.list}Heat Identification &amp; Customer Specification</span></div>
    <div class="panel-sub">Heat ID is generated automatically and is unique per heat. All other fields are optional plant-entered data (Level 3 source-of-truth) — never assumed.</div>
    <div class="field-grid">
      <div class="field"><label>Heat ID</label><div class="readonly-field">${esc(h.heatId)}</div></div>
      ${heatField('Date', 'heatDate', h.date)}
      ${heatField('Time', 'heatTime', h.time)}
      ${heatField('Furnace ID', 'furnaceId', h.furnaceId, 'e.g. IF-1')}
      ${heatField('Furnace Type', 'furnaceType', h.furnaceType, 'e.g. Induction')}
      ${heatField('Operator', 'operator', h.operator)}
      ${heatField('Melting In-Charge', 'meltingIncharge', h.meltingIncharge)}
      ${heatField('Metallurgist', 'metallurgist', h.metallurgist)}
      ${heatField('Customer', 'customer', h.customer)}
      ${heatField('Product', 'product', h.product)}
      ${heatField('Part Number', 'partNumber', h.partNumber)}
      ${heatField('Drawing Number', 'drawingNumber', h.drawingNumber)}
      ${heatField('Drawing Revision', 'drawingRevision', h.drawingRevision)}
      ${heatField('PO Number', 'poNumber', h.poNumber)}
      ${heatField('Work Order', 'workOrder', h.workOrder)}
    </div>
  </div>`;
    }

    /* ================= 13d. AIM SOURCE / TARGET-SOURCE NOTE (section 13) ================= */
    function renderAimSourceNote() {
      const src = aimSource();
      return `
  <div class="field-grid" style="margin-top:10px;align-items:end;">
    <div class="field">
      <label>Target Source</label>
      <div class="readonly-field">${esc(src)}</div>
    </div>
    <div class="field" style="display:flex;align-items:center;padding-top:18px;">
      <label style="display:flex;align-items:center;gap:8px;margin:0;cursor:pointer;font-size:12px;">
        <input type="checkbox" data-action="customerAimApproved" ${activeState().customerAimApproved ? 'checked' : ''} style="width:15px;height:15px;accent-color:var(--accent);" />
        Mark current AIM as Customer Approved Specification
      </label>
    </div>
  </div>
  <div class="note">Default AIM priority is Customer Approved AIM → Grade AIM → Planning AIM. This workbook has no separate Grade-AIM column, so the un-checked default is always PLANNING AIM (grade Min/Max midpoint) — never fabricated.</div>`;
    }

    /* ================= 13e. CORRECTION ENGINE PANEL (sections 16-21) ================= */
    function renderCorrectionEngine() {
      const plan = buildCorrectionPlan();
      const applied = correctionsFor();
      const conflicts = correctionConflicts();
      const cards = plan.map(p => {
        if (p.status === 'NOT ENTERED') return `<div class="correction-card"><div class="cc-head"><span class="cc-el">${p.el}</span><span class="na-tag">ENTER OES-1</span></div></div>`;
        if (p.status === 'OK') return `<div class="correction-card"><div class="cc-head"><span class="cc-el">${p.el}</span><span class="status-pill status-ok">ON TARGET</span></div><div class="cc-body">Current <b>${fmt(p.actual, 3)}%</b> vs AIM <b>${fmt(p.aim, 3)}%</b> — within tolerance, no correction needed.</div></div>`;
        if (p.status === 'LOW') {
          const body = p.recTag === 'NOT CONFIGURED' || p.recTag === 'DATA REQUIRED'
            ? `<div class="cc-body">Current <b>${fmt(p.actual, 3)}%</b> · AIM <b>${fmt(p.aim, 3)}%</b> · Deficit <b>${fmt(p.deficit, 3)} pts</b><br/><span class="na-tag">${p.recTag}</span> — ${esc(p.detail)}</div>`
            : `<div class="cc-body">Current <b>${fmt(p.actual, 3)}%</b> · AIM <b>${fmt(p.aim, 3)}%</b> · Deficit <b>${fmt(p.deficit, 3)} pts</b><br/>
           Recommended Addition: <b>${esc(p.addition.name)}</b> (${p.conc}% ${p.el}, ${p.recov}% recovery)<br/>
           Required Quantity: <b>${fmt(p.qty, 2)} kg</b> · Expected ${p.el} After Addition: <b>${fmt(p.expectedAfter, 3)}%</b><br/>
           <button class="btn btn-sm btn-accent" data-action="applyCorrection" data-el="${p.el}" data-addition="${p.addition.id}" data-qty="${p.qty}">Apply This Addition</button>
           <button class="details-toggle" data-action="showCorrectionCalc" data-el="${p.el}" style="margin-left:10px;">View Calculation</button>
           <div class="calc-details-box" id="cc-calc-${p.el}" style="display:none;margin-top:8px;">
             <div class="cd-line"><span>Bath Weight</span><b>${fmt(p.bathWeight, 1)} kg</b></div>
             <div class="cd-line"><span>Deficit</span><b>${fmt(p.deficit, 3)} percentage points</b></div>
             <div class="cd-line"><span>Addition ${p.el}% × Recovery%</span><b>${p.conc}% × ${p.recov}%</b></div>
             <div class="cd-line"><span>Qty = Bath × Deficit ÷ (Conc × Recovery)</span><b>${fmt(p.qty, 2)} kg</b></div>
             <div class="cd-line"><span>Expected Result</span><b>${fmt(p.expectedAfter, 3)}%</b></div>
           </div>`;
          return `<div class="correction-card"><div class="cc-head"><span class="cc-el">${p.el}</span><span class="status-pill status-low">LOW</span></div>${body}</div>`;
        }
        // HIGH
        let body;
        if (p.classification === 'DILUTION REQUIRED') {
          body = `<div class="cc-body">Current <b>${fmt(p.actual, 3)}%</b> · AIM <b>${fmt(p.aim, 3)}%</b><br/>
        <span class="na-tag">DILUTION REQUIRED</span> — Recommended Diluent: <b>${esc(p.diluent.name)}</b> (${p.diluent.conc}% ${p.el})<br/>
        Required Quantity: <b>${fmt(p.qty, 2)} kg</b> · Expected ${p.el} After Dilution: <b>${fmt(p.expectedAfter, 3)}%</b><br/>
        <button class="btn btn-sm" data-action="applyDilution" data-el="${p.el}" data-material="${esc(p.diluent.name)}" data-qty="${p.qty}">Add to Charge Mix</button></div>`;
        } else {
          body = `<div class="cc-body">Current <b>${fmt(p.actual, 3)}%</b> · AIM <b>${fmt(p.aim, 3)}%</b><br/><span class="na-tag">${esc(p.classification)}</span> — ${esc(p.detail)}</div>`;
        }
        return `<div class="correction-card"><div class="cc-head"><span class="cc-el">${p.el}</span><span class="status-pill status-high">HIGH</span></div>${body}</div>`;
      }).join('');

      const appliedHTML = applied.length ? `
    <div class="subsection-title">Applied Additions (this heat)</div>
    <table class="dtable"><thead><tr><th>Addition</th><th>Qty (kg)</th><th>Rate ₹/kg</th><th>Cost</th><th></th></tr></thead>
    <tbody>${applied.map(c => {
        const a = alloyAdditionMaster.find(x => x.id === c.additionId);
        return `<tr><td>${esc(a ? a.name : 'Unknown')}</td><td><input type="number" min="0" step="1" data-action="correctionQty" data-corr="${c.id}" value="${esc(c.qty)}" /></td><td class="num">${fmt(a ? a.rate : 0, 0)}</td><td class="num">₹${fmt(num(c.qty) * (a ? a.rate : 0), 2)}</td><td><button class="row-remove" data-action="removeCorrection" data-corr="${c.id}">✕</button></td></tr>`;
      }).join('')}</tbody></table>` : '';

      return `
  <div class="panel">
    <div class="panel-title"><span class="ti">${ICONS.flask}OES-1 → Correction Calculator</span></div>
    <div class="panel-sub">Deficit/Excess is Target AIM − Actual OES-1, in percentage points (not percent-change). Corrections use only configured Alloy Addition Master or configured material chemistry — nothing here is invented.</div>
    ${cards}
    ${conflicts.length ? `<div class="data-warning"><div><b>CORRECTION CONFLICT:</b> applying the current addition(s) is projected to push ${conflicts.map(c => `${c.el} ${c.type === 'ABOVE MAX' ? 'above maximum' : 'below minimum'} (${fmt(c.value, 3)}%)`).join('; ')}. Review before applying at melt.</div></div>` : ''}
    ${appliedHTML}
    <div class="honesty-note">HEURISTIC OPTIMIZATION: correction quantities are calculated from single-pass mass-balance (Bath Weight × Deficit ÷ (Concentration × Recovery)), not an iterative solver. Re-check with an actual OES-2 reading after addition.</div>
  </div>`;
    }

    /* ================= 13f. OES-2 / FINAL CHEMISTRY (sections 22, 30) ================= */
    function renderOesTwo() {
      const g = getSelectedGrade();
      const rows = ELEMENTS.map(el => {
        const { min, max } = g.chemistry[el];
        const v2 = oesTwoFor(el);
        const status2 = v2 === '' ? 'na' : (num(v2) < min - 1e-9 ? 'low' : (num(v2) > max + 1e-9 ? 'high' : 'ok'));
        return `<tr>
      <td class="elname">${el}</td>
      <td class="num">${fmt(min, 3)}</td>
      <td class="num">${fmt(max, 3)}</td>
      <td><input type="number" step="0.001" placeholder="—" data-action="oesTwo" data-element="${el}" value="${esc(v2)}" /></td>
      <td>${statusPill(status2)}</td>
    </tr>`;
      }).join('');
      return `
  <div class="panel">
    <div class="panel-title"><span class="ti">${ICONS.flask}OES-2 — Final Chemistry</span></div>
    <div class="panel-sub">Log the post-correction lab reading here. This becomes the Final Chemistry used for Heat Release.</div>
    <table class="dtable">
      <thead><tr><th>Element</th><th>Min %</th><th>Max %</th><th>OES-2 %</th><th>Status</th></tr></thead>
      <tbody>${rows}</tbody>
    </table>
  </div>`;
    }

    /* ================= 13g. RESIDUAL ELEMENTS (section 28) ================= */
    function renderResiduals() {
      const tracked = residualElementsFor();
      const untracked = RESIDUAL_CANDIDATES.filter(el => !tracked.includes(el));
      const rows = tracked.map(el => {
        const st = residualStatus(el);
        const stCls = { 'OK': 'status-ok', 'EXCEEDS LIMIT': 'status-high', 'NOT ENTERED': 'status-na', 'NO LIMIT CONFIGURED': 'status-na' }[st];
        return `<tr>
      <td class="elname">${el}</td>
      <td><input type="number" step="0.001" placeholder="—" data-action="residualActual" data-element="${el}" value="${esc(residualActualFor(el))}" /></td>
      <td><input type="number" step="0.001" placeholder="ENTER PLANT DATA" data-action="residualLimit" data-element="${el}" value="${esc(residualLimitFor(el))}" /></td>
      <td><span class="status-pill ${stCls}">${st}</span></td>
      <td><button class="row-remove" data-action="removeResidual" data-element="${el}">✕</button></td>
    </tr>`;
      }).join('') || `<tr><td colspan="5" style="color:var(--text-mute);">No residual elements are being tracked for this heat.</td></tr>`;
      return `
  <div class="panel">
    <div class="panel-title"><span class="ti">${ICONS.shield}Residual Elements</span></div>
    <div class="panel-sub">Residual limits must come from configured plant/customer data — they are never assumed. Add elements to track as needed for this customer/grade.</div>
    <table class="dtable">
      <thead><tr><th>Element</th><th>Actual %</th><th>Max % (plant/customer)</th><th>Status</th><th></th></tr></thead>
      <tbody>${rows}</tbody>
    </table>
    ${untracked.length ? `<div class="field-grid" style="margin-top:10px;"><div class="field"><label>Add Residual Element</label>
      <select data-action="addResidual"><option value="">Select…</option>${untracked.map(el => `<option value="${el}">${el}</option>`).join('')}</select></div></div>` : ''}
  </div>`;
    }

    /* ================= 13h. YIELD & LOSS (section 30) ================= */
    function ylField(label, key, val) {
      return `<div class="field"><label>${esc(label)}</label><input type="number" min="0" step="1" data-action="yl-${key}" value="${esc(val || '')}" /></div>`;
    }

    <div class="field-grid">
      ${ylField('Charged Weight (kg)', 'chargedWeight', yl.chargedWeight)}

      ${ylField('Pouring Loss (kg)', 'pouringLoss', yl.pouringLoss)}
      ${ylField('Other Loss (kg)', 'otherLoss', yl.otherLoss)}
      ${ylField('Final Metal Weight (kg)', 'finalMetalWeight', yl.finalMetalWeight)}
    </div>
    <div class="totals-row">
      <div>Planned Yield <b>${fmt(num(activeState().yieldPct), 1)}%</b></div>
      <div>Actual Yield <b>${actualYield === null ? 'ENTER PLANT DATA' : fmt(actualYield, 2) + '%'}</b></div>
      <div>Variance <b>${variance === null ? '—' : (variance > 0 ? '+' : '') + fmt(variance, 2) + ' pts'}</b></div>

      ${pdField('Ladle Temp (°C)', 'ladleTemp', pd.ladleTemp)}

      ${pdField('Runner Weight (kg)', 'runnerWeight', pd.runnerWeight)}

    /* ================= 13j. WARNING ENGINE PANEL (section 38) ================= */
    function renderWarningsPanel() {

  <div class="panel">

    <div class="note">No active warnings for this heat.</div>
  </div>`;
      return `
  <div class="panel">
    <div class="panel-title"><span class="ti">${ICONS.alert}Warnings (${warnings.length})</span></div>
    <div class="warn-list">
      ${warnings.map(w => `<div class="warn-item warn-${w.sev}"><span class="warn-badge">${w.sev}</span><span>${esc(w.text)}</span></div>`).join('')}

    /* ================= 13k. QUALITY / RELEASE (sections 33, 34, 50) ================= */
    function renderQualityRelease() {
      const rel = evaluateRelease();
      const status = deriveHeatStatus();
      const a = activeState().approvals;
      return `
  <div class="panel">
    <div class="panel-title"><span class="ti">${ICONS.shield}Quality Check &amp; Heat Release</span>
      <span class="heat-status-pill ${heatStatusCssClass(status)}">${esc(status)}</span>

    /* ================= 13o. INGOT PRODUCTION / WEIGHT & YIELD (Ingot Calculator, sections 9-11, 26) ================= */
    function renderIngotProduction() {
      const ip = ingotProductionState();
      const target = num(ip.targetWeight);
      const tol = num(ip.toleranceKg);
      const ids = ingotHeatIds();
      const totalTarget = calculateTotalTargetIngotWeight();
      const totalActual = calculateActualTotalIngotWeight();
      const reqCharge = calculateIngotRequiredCharge();

      const rows = ids.map((id, i) => {
        const val = ip.actualWeights[i] !== undefined ? ip.actualWeights[i] : '';
        const st = ingotWeightStatus(val, target, tol);
        const stCls = { 'WITHIN TOLERANCE': 'status-ok', 'NOT ENTERED': 'status-na', 'NOT CONFIGURED': 'status-na' }[st] || 'status-high';
        return `<tr><td class="elname">${esc(id)}</td><td><input type="number" min="0" step="0.1" data-action="ingotWeight" data-idx="${i}" value="${esc(val)}" /></td><td><span class="status-pill ${stCls}">${st}</span></td></tr>`;
      }).join('') || `<tr><td colspan="3" style="color:var(--text-mute);">Set "Number of Ingots" above to enter individual actual weights.</td></tr>`;

      return `
  <div class="panel">
    <div class="panel-title"><span class="ti">${ICONS.scale}Ingot Production Target &amp; Weight</span></div>
    <div class="panel-sub">Required Charge = Required Finished Weight ÷ (Yield ÷ 100). Weight tolerance and target weight are plant/customer-entered — never assumed.</div>
    <div class="field-grid">
      <div class="field"><label>Target Weight / Ingot (kg)</label><input type="number" min="0" step="1" data-action="ip-targetWeight" value="${esc(ip.targetWeight)}" /></div>
      <div class="field"><label>Number of Ingots</label><input type="number" min="0" step="1" data-action="ip-numberOfIngots" value="${esc(ip.numberOfIngots)}" /></div>
      <div class="field"><label>Weight Tolerance (kg)</label><input type="number" min="0" step="0.1" data-action="ip-toleranceKg" value="${esc(ip.toleranceKg)}" placeholder="ENTER PLANT DATA" /></div>
    </div>
    <div class="totals-row">
      <div>Total Target Weight <b>${totalTarget === null ? 'NOT CONFIGURED' : fmt(totalTarget, 1) + ' kg'}</b></div>
      <div>Required Charge Weight <b>${reqCharge === null ? 'NOT CONFIGURED' : fmt(reqCharge, 1) + ' kg'}</b></div>
      <div>Total Actual Weight <b>${totalActual === null ? 'ENTER PLANT DATA' : fmt(totalActual, 1) + ' kg'}</b></div>
      <div>Variance <b>${(totalActual !== null && totalTarget !== null) ? fmt(totalActual - totalTarget, 1) + ' kg' : '—'}</b></div>
    </div>
    <table class="dtable" style="margin-top:12px;"><thead><tr><th>Ingot ID</th><th>Actual Weight (kg)</th><th>Status</th></tr></thead><tbody>${rows}</tbody></table>
  </div>`;
    }

    function renderIngotPlaceholder() {
      return `
  <div class="panel">

      <div class="icn">${ICONS.layers}</div>
      <h3>INGOT GRADE CHEMISTRY NOT CONFIGURED</h3>
      <p>The Ingot Calculator's full engine — grade selection, Min/AIM/Max chemistry &amp; OES-1/OES-2, dynamic Charge Mix, Auto Calculate optimizer, Correction Calculator, Residuals, Yield &amp; Loss, Cost, Quality/Release, History and PDF report — is fully built and shares the same engine as the Casting Calculator. It is intentionally running on an empty <code>ingotMasterData</code> object because the current Excel workbook does not include Ingot grades, chemistry ranges, raw-material chemistry or rates.
      No values are invented in the meantime. Populate <code>ingotMasterData.grades</code> and <code>ingotMasterData.scrapMaterials</code> in the source file (same shape as <code>castingMasterData</code>) to activate grade-based calculation. The Ingot Product identity/traceability layer below does not depend on that and can already be configured.</p>

    /* ================= 13a2. INGOT DATA PROVENANCE BANNER ================= */
    function renderIngotProvenanceBanner() {
      if (!INGOT_DATA_MIRRORS_CASTING) return '';
      return `
  <div class="banner-info">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>

      if (state.view === 'history') {
        app.innerHTML = `<div class="wrap">${topbar()}${renderHistoryPage()}</div>`;
        return;
      }
      let body;
      if (state.calculator === 'ingot' && activeMaster().grades.length === 0) {
        body = renderIngotPlaceholder();
      } else {
        ensureGradeState(activeCalc(), activeState().grade);
        body = `
    ${session && session.role === 'admin' ? renderEmployeeAdmin() : ''}
    ${renderHeatDashboard()}

    ${renderChemistryTable()}

    ${renderOesTwo()}
    ${renderResiduals()}

    ${renderQualityRelease()}

    /* ================= HISTORY PAGE (server data, all users can view, admin can edit) ================= */
    const historyUI = { list: [], loading: false, error: null, q: '', calc: 'all', status: 'all', detail: null, editing: false, msg: '', msgBad: false };

    const hxIsAdmin = () => !!(session && session.role === 'admin');
    const hx = v => esc(v === null || v === undefined ? '' : v);
    const hxDate = v => (v ? new Date(v).toLocaleString('en-IN') : '—');
    const hxNum = (v, d = 3) => (v === null || v === undefined || v === '' ? '—' : fmt(Number(v), d));
    const hxLabel = k => String(k).replace(/([A-Z])/g, ' $1').replace(/^./, c => c.toUpperCase());
    const HX_APPROVAL_ROLES = [['operator', 'Operator'], ['melting_incharge', 'Melting In-charge'], ['metallurgist', 'Metallurgist'], ['qa', 'QA']];
    const HX_INFO_FIELDS = [['date', 'Date'], ['time', 'Time'], ['furnaceId', 'Furnace ID'], ['furnaceType', 'Furnace Type'], ['operator', 'Operator'],
    ['meltingIncharge', 'Melting In-charge'], ['metallurgist', 'Metallurgist'], ['customer', 'Customer'], ['product', 'Product'],
    ['partNumber', 'Part Number'], ['drawingNumber', 'Drawing Number'], ['drawingRevision', 'Drawing Revision'], ['poNumber', 'PO Number'], ['workOrder', 'Work Order']];

    async function hxLoadList(showSpinner = true) {
      if (showSpinner) { historyUI.loading = true; historyUI.error = null; render(); }
      try { historyUI.list = await apiFetch('/heats'); historyUI.error = null; }
      catch (e) { historyUI.error = e.message; }
      historyUI.loading = false;
      render();
    }
    async function hxOpen(heatNo) {
      historyUI.error = null; historyUI.msg = '';
      try { historyUI.detail = await apiFetch('/heats/' + encodeURIComponent(heatNo)); historyUI.editing = false; }
      catch (e) { historyUI.error = e.message; }
      render();
    }

    function hxFiltered() {
      const q = historyUI.q.trim().toLowerCase();
      return historyUI.list.filter(h =>
        (historyUI.calc === 'all' || h.calculator === historyUI.calc) &&
        (historyUI.status === 'all' || h.status === historyUI.status) &&
        (!q || [h.heat_no, h.grade_name, h.created_by_name, h.created_by_code].join(' ').toLowerCase().includes(q)));
    }
    function hxTableRows() {
      const rows = hxFiltered();
      if (!rows.length) return `<tr><td colspan="10" style="color:#888;">No heats found.</td></tr>`;
      return rows.map(h => `
    <tr>
      <td><b style="font-family:var(--font-mono);">${hx(h.heat_no)}</b></td>
      <td>${hx(h.grade_name || '—')}</td>
      <td>${hx(h.calculator)}</td>
      <td><b style="color:var(--${h.status === 'RELEASED' ? 'good' : 'warn'});">${hx(h.status)}</b></td>
      <td>${hx(h.created_by_name)}</td>
      <td>${hxDate(h.created_at)}</td>
      <td>${h.released_at ? hxDate(h.released_at) : '—'}</td>
      <td>${Number(h.approval_count) || 0}/4</td>
      <td class="num">${h.finished_cost_per_kg !== null && h.finished_cost_per_kg !== undefined ? fmtMoney(Number(h.finished_cost_per_kg)) : '—'}</td>
      <td><button class="btn btn-sm" data-action="hxOpen" data-heat="${hx(h.heat_no)}">View</button></td>
    </tr>`).join('');
    }
    function hxCountText() { return `${hxFiltered().length} of ${historyUI.list.length} heats`; }

    function renderHistoryPage() {
      if (historyUI.detail) return renderHeatDetail();
      const err = historyUI.error ? `<div class="note" style="color:var(--bad);margin-bottom:10px;">${hx(historyUI.error)}</div>` : '';
      return `
  <div class="panel">
    <div class="panel-title"><span class="ti">${ICONS.history}History — All Heats</span></div>
    <div class="local-only-banner" style="background:var(--good-dim);border-color:var(--good);color:var(--text-dim);">SERVER DATA — every heat pushed to the backend is listed here for all users. ${hxIsAdmin() ? 'You are an admin: you can open a heat and edit it.' : 'View only: editing is available to admins.'}</div>
    ${err}
    <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;margin:12px 0;">
      <div class="field"><label>Search</label><input id="hxSearch" type="text" placeholder="Heat no, grade, creator" value="${hx(historyUI.q)}" autocomplete="off"></div>
      <div class="field"><label>Calculator</label><select id="hxCalc">
        <option value="all" ${historyUI.calc === 'all' ? 'selected' : ''}>All</option>
        <option value="casting" ${historyUI.calc === 'casting' ? 'selected' : ''}>Casting</option>
        <option value="ingot" ${historyUI.calc === 'ingot' ? 'selected' : ''}>Ingot</option></select></div>
      <div class="field"><label>Status</label><select id="hxStatus">
        <option value="all" ${historyUI.status === 'all' ? 'selected' : ''}>All</option>
        <option value="DRAFT" ${historyUI.status === 'DRAFT' ? 'selected' : ''}>Draft</option>
        <option value="RELEASED" ${historyUI.status === 'RELEASED' ? 'selected' : ''}>Released</option></select></div>
      <button class="btn btn-sm" data-action="hxRefresh">Refresh</button>
      <span id="hxCount" style="font-size:12px;color:var(--text-dim);">${historyUI.loading ? 'Loading…' : hxCountText()}</span>
    </div>
    <div style="overflow-x:auto;">
    <table class="dtable">
      <thead><tr><th>Heat No</th><th>Grade</th><th>Type</th><th>Status</th><th>Created by</th><th>Created</th><th>Released</th><th>Approvals</th><th class="num">Cost/kg</th><th></th></tr></thead>
      <tbody id="hxBody">${historyUI.loading ? '<tr><td colspan="10">Loading…</td></tr>' : hxTableRows()}</tbody>
    </table></div>
  </div>`;
    }

    /* ---- one heat in full ---- */
    function hxElements(obj) {
      const keys = Object.keys(obj || {});
      return [...new Set([...ELEMENTS, ...keys])];
    }
    function hxInput(id, v, type = 'number') {
      return `<input id="${id}" type="${type}" ${type === 'number' ? 'step="any"' : ''} value="${hx(v)}" style="width:${type === 'number' ? '100px' : '150px'};">`;
    }
    function hxKV(obj) {
      const entries = Object.entries(obj || {}).filter(([, v]) => v !== '' && v !== null && v !== undefined && typeof v !== 'object');
      if (!entries.length) return '<div class="note">Not recorded.</div>';
      return `<table class="dtable"><tbody>${entries.map(([k, v]) => `<tr><td>${hx(hxLabel(k))}</td><td class="num">${hx(v)}</td></tr>`).join('')}</tbody></table>`;
    }
    function hxDetailsText(d) {
      if (!d || !Object.keys(d).length) return '';
      const j = v => { const s = JSON.stringify(v); return s && s.length > 160 ? s.slice(0, 160) + '…' : s; };
      if ('from' in d || 'to' in d) return `<div style="font-size:11.5px;color:var(--text-dim);word-break:break-all;">from ${hx(j(d.from))} → ${hx(j(d.to))}</div>`;
      return `<div style="font-size:11.5px;color:var(--text-dim);word-break:break-all;">${hx(j(d))}</div>`;
    }
    function hxValueTable(title, obj, prefix, edit) {
      const els = edit ? hxElements(obj) : Object.keys(obj || {});
      const rows = els.map(el => `<tr><td class="elname">${hx(el)}</td><td class="num">${edit ? hxInput(prefix + el, (obj || {})[el]) : hxNum((obj || {})[el], 5)}</td></tr>`).join('')
        || '<tr><td colspan="2" style="color:#888;">Not recorded.</td></tr>';
      return `<div><div class="subsection-title">${title}</div><table class="dtable"><thead><tr><th>Element</th><th class="num">%</th></tr></thead><tbody>${rows}</tbody></table></div>`;
    }

    function renderHeatDetail() {
      const d = historyUI.detail;
      const edit = historyUI.editing && hxIsAdmin();
      const info = d.heatInfo || {};
      const infoHeat = info.heat || {};
      const grid = 'display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px;';

      const buttons = hxIsAdmin()
        ? (edit
          ? `<button class="btn btn-accent" data-action="hxSave">Save Changes</button> <button class="btn" data-action="hxCancel">Cancel</button>`
          : `<button class="btn btn-accent" data-action="hxEdit">Edit (Admin)</button>`)
        : '';
      const contBtn = (!edit && hxCanContinue(d)) ? `<button class="btn btn-accent" data-action="hxContinue">Continue in Calculator</button>` : '';
      const msg = historyUI.msg ? `<div style="margin:8px 0;font-size:12.5px;color:var(--${historyUI.msgBad ? 'bad' : 'good'});">${hx(historyUI.msg)}</div>` : '';
      const err = historyUI.error ? `<div class="note" style="color:var(--bad);">${hx(historyUI.error)}</div>` : '';

      const approvals = HX_APPROVAL_ROLES.map(([code, label]) => {
        const a = (d.approvals || {})[code];
        return `<tr><td>${label}</td><td>${a ? hx(a.name) + ' (' + hx(a.by) + ')' : '<span style="color:var(--warn);">Pending</span>'}</td><td>${a ? hxDate(a.at) : '—'}</td></tr>`;
      }).join('');

      const charge = (d.chargeRows || []).map((r, i) => `
      <tr><td>${edit ? hxInput('hxCS_' + i, r.scrapName, 'text') : hx(r.scrapName)}</td>
      <td class="num">${edit ? hxInput('hxCQ_' + i, r.qtyKg) : hxNum(r.qtyKg)}</td>
      <td class="num">${edit ? hxInput('hxCP_' + i, r.pricePerKg) : hxNum(r.pricePerKg)}</td>
      <td class="num">${r.pricePerKg !== null && r.pricePerKg !== undefined ? fmtMoney(Number(r.qtyKg) * Number(r.pricePerKg)) : '—'}</td></tr>`).join('')
        || '<tr><td colspan="4" style="color:#888;">No charge rows.</td></tr>';

      const resid = (d.residuals || []).map((r, i) => `
      <tr><td class="elname">${hx(r.element)}</td>
      <td class="num">${edit ? hxInput('hxRA_' + i, r.actualPct) : hxNum(r.actualPct, 5)}</td>
      <td class="num">${edit ? hxInput('hxRL_' + i, r.limitPct) : hxNum(r.limitPct, 5)}</td></tr>`).join('')
        || '<tr><td colspan="3" style="color:#888;">Not recorded.</td></tr>';

      const yl = d.yieldLoss || {};
      const cs = d.costSnapshot;

      const infoRows = HX_INFO_FIELDS.map(([k, label]) => `
      <tr><td>${label}</td><td>${edit ? hxInput('hxI_' + k, infoHeat[k], 'text') : hx(infoHeat[k] || '—')}</td></tr>`).join('');
      const infoEmpty = !Object.keys(info).length
        ? '<div class="note">No extra heat details were saved for this heat. Push it again from the Calculator to store them.</div>' : '';

      const corr = (info.corrections || []).map(c => `<tr><td>${hx(c.additionId)}</td><td class="num">${hx(c.qty)}</td></tr>`).join('');

      const timeline = (d.history || []).map(h => `
      <div class="history-item"><div class="hi-main"><b>${hx(String(h.action).replace(/_/g, ' '))}</b> — ${hx(h.name || 'system')}${h.employee_code ? ' (' + hx(h.employee_code) + ')' : ''} · ${hxDate(h.created_at)}${hxDetailsText(h.details)}</div></div>`).join('')
        || '<div class="note">No activity recorded.</div>';

      return `
  <div class="panel">
    <div class="panel-title"><span class="ti">${ICONS.history}Heat ${hx(d.id)}</span></div>
    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px;">
    <button class="btn" data-action="hxBack">← Back to list</button>${buttons}${contBtn}
    </div>
    ${msg}${err}
    <div style="${grid}">
      <div><div class="subsection-title">Summary</div><table class="dtable"><tbody>
        <tr><td>Grade</td><td>${edit ? hxInput('hxGrade', d.gradeName, 'text') : hx(d.gradeName || '—')}</td></tr>
        <tr><td>Type</td><td>${hx(d.calculator)}</td></tr>
        <tr><td>Status</td><td><b style="color:var(--${d.status === 'RELEASED' ? 'good' : 'warn'});">${hx(d.status)}</b></td></tr>
        <tr><td>Data confidence</td><td>${hx(d.dataConfidence)}</td></tr>
        <tr><td>Created by</td><td>${hx(d.created_by_name)}</td></tr>
        <tr><td>Created</td><td>${hxDate(d.createdAt)}</td></tr>
        <tr><td>Last updated</td><td>${hxDate(d.updatedAt)}</td></tr>
        <tr><td>Released by</td><td>${hx(d.released_by_name || '—')}</td></tr>
        <tr><td>Released at</td><td>${d.releasedAt ? hxDate(d.releasedAt) : '—'}</td></tr></tbody></table></div>
      <div><div class="subsection-title">Heat Details</div>${infoEmpty}<table class="dtable"><tbody>${infoRows}</tbody></table></div>
      <div><div class="subsection-title">Approvals</div><table class="dtable"><thead><tr><th>Role</th><th>By</th><th>When</th></tr></thead><tbody>${approvals}</tbody></table></div>
    </div>

    <div style="${grid}margin-top:16px;">
      ${hxValueTable('Target Chemistry (AIM)', d.targets, 'hxT_', edit)}
      ${hxValueTable('OES-1', d.oes1, 'hxO1_', edit)}
      ${hxValueTable('OES-2', d.oes2, 'hxO2_', edit)}
    </div>

    <div class="subsection-title" style="margin-top:16px;">Charge Mix</div>
    <div style="overflow-x:auto;"><table class="dtable"><thead><tr><th>Scrap</th><th class="num">Qty (kg)</th><th class="num">Rate (₹/kg)</th><th class="num">Line cost</th></tr></thead><tbody>${charge}</tbody></table></div>

    <div style="${grid}margin-top:16px;">
      <div><div class="subsection-title">Residuals</div><table class="dtable"><thead><tr><th>Element</th><th class="num">Actual %</th><th class="num">Limit %</th></tr></thead><tbody>${resid}</tbody></table></div>
      <div><div class="subsection-title">Yield</div><table class="dtable"><tbody>
        <tr><td>Charged weight (kg)</td><td class="num">${edit ? hxInput('hxYC', yl.chargedWeightKg) : hxNum(yl.chargedWeightKg)}</td></tr>
        <tr><td>Final metal weight (kg)</td><td class="num">${edit ? hxInput('hxYF', yl.finalMetalWeightKg) : hxNum(yl.finalMetalWeightKg)}</td></tr></tbody></table></div>
      <div><div class="subsection-title">Cost Snapshot (at release)</div>${cs ? `<table class="dtable"><tbody>
        <tr><td>Raw charge cost</td><td class="num">${fmtMoney(Number(cs.raw_charge_cost))}</td></tr>
        <tr><td>Charged (kg)</td><td class="num">${hxNum(cs.charged_kg)}</td></tr>
        <tr><td>Finished weight (kg)</td><td class="num">${hxNum(cs.finished_weight_kg)}</td></tr>
        <tr><td>Finished cost / kg</td><td class="num">${cs.finished_cost_per_kg !== null ? fmtMoney(Number(cs.finished_cost_per_kg)) : '—'}</td></tr>
        <tr><td>Taken at</td><td class="num">${hxDate(cs.created_at)}</td></tr></tbody></table>` : '<div class="note">The cost snapshot is created when the heat is released.</div>'}</div>
    </div>

    <div style="${grid}margin-top:16px;">
      <div><div class="subsection-title">Calculation Settings</div>${hxKV({ heatSize: info.heatSize, yieldPct: info.yieldPct, meltingRate: info.meltingRate, powerRate: info.powerRate, otherRate: info.otherRate, sellingPrice: info.sellingPrice })}</div>
      <div><div class="subsection-title">Process Data</div>${hxKV(info.processData)}</div>
      <div><div class="subsection-title">Yield &amp; Loss Breakdown</div>${hxKV(info.yieldLoss)}</div>
      ${corr ? `<div><div class="subsection-title">Corrections</div><table class="dtable"><thead><tr><th>Addition</th><th class="num">Qty</th></tr></thead><tbody>${corr}</tbody></table></div>` : ''}
    </div>

    <div class="subsection-title" style="margin-top:16px;">Activity Timeline</div>
    ${timeline}
  </div>`;
    }

    /* ---- admin save: only the sections that actually changed are sent ---- */
    const hxNormObj = o => JSON.stringify(Object.fromEntries(Object.entries(o || {}).sort().map(([k, v]) => [k, v === null || v === '' || v === undefined ? null : Number(v)])));
    const hxNormRows = r => JSON.stringify((r || []).map(x => [String(x.scrapName ?? x.element ?? ''), x.qtyKg ?? x.actualPct ?? null, x.pricePerKg ?? x.limitPct ?? null].map((v, i) => (i === 0 ? v : (v === null || v === '' ? null : Number(v))))));

    async function hxSave() {
      const d = historyUI.detail;
      if (!d || !hxIsAdmin()) return;
      if (d.status === 'RELEASED' &&
        !confirm('This heat is RELEASED. Your edits will NOT update the cost snapshot taken at release. Continue?')) return;

      const val = id => { const el = document.getElementById(id); return el ? el.value.trim() : ''; };
      const numOrNull = s => (s === '' ? null : Number(s));
      const base = '/heats/' + encodeURIComponent(d.id);
      const jobs = [];

      const grade = val('hxGrade');
      if (grade && grade !== d.gradeName) jobs.push([base, 'PATCH', { gradeName: grade }]);

      const readObj = (prefix, source) => {
        const out = {};
        hxElements(source).forEach(el => { const v = val(prefix + el); if (v !== '') out[el] = Number(v); });
        return out;
      };
      const targets = readObj('hxT_', d.targets);
      if (hxNormObj(targets) !== hxNormObj(d.targets)) jobs.push([base + '/targets', 'PUT', { targets }]);
      const o1 = readObj('hxO1_', d.oes1);
      if (hxNormObj(o1) !== hxNormObj(d.oes1)) jobs.push([base + '/oes', 'POST', { stage: 'oes1', readings: o1 }]);
      const o2 = readObj('hxO2_', d.oes2);
      if (hxNormObj(o2) !== hxNormObj(d.oes2)) jobs.push([base + '/oes', 'POST', { stage: 'oes2', readings: o2 }]);

      const rows = (d.chargeRows || []).map((r, i) => ({ scrapName: val('hxCS_' + i), qtyKg: numOrNull(val('hxCQ_' + i)) ?? 0, pricePerKg: numOrNull(val('hxCP_' + i)) }));
      if (hxNormRows(rows) !== hxNormRows(d.chargeRows)) jobs.push([base + '/charge-rows', 'PUT', { rows }]);

      const residuals = (d.residuals || []).map((r, i) => ({ element: r.element, actualPct: numOrNull(val('hxRA_' + i)), limitPct: numOrNull(val('hxRL_' + i)) }));
      if (hxNormRows(residuals) !== hxNormRows(d.residuals)) jobs.push([base + '/residuals', 'PUT', { residuals }]);

      const yl = { chargedWeightKg: numOrNull(val('hxYC')), finalMetalWeightKg: numOrNull(val('hxYF')) };
      const oy = d.yieldLoss || {};
      if (hxNormObj(yl) !== hxNormObj(oy)) jobs.push([base + '/yield-loss', 'PATCH', yl]);

      const oldHeat = (d.heatInfo && d.heatInfo.heat) || {};
      const newHeat = { ...oldHeat };
      HX_INFO_FIELDS.forEach(([k]) => { const v = val('hxI_' + k); if (v !== '' || k in oldHeat) newHeat[k] = v; });
      if (JSON.stringify(newHeat) !== JSON.stringify(oldHeat)) {
        jobs.push([base + '/info', 'PUT', { info: { ...(d.heatInfo || {}), heat: newHeat } }]);
      }

      if (!jobs.length) { historyUI.editing = false; historyUI.msg = 'No changes to save.'; historyUI.msgBad = false; render(); return; }

      try {
        for (const [path, method, body] of jobs) await apiFetch(path, { method, body: JSON.stringify(body) });
        const heatNo = d.id;
        historyUI.detail = await apiFetch('/heats/' + encodeURIComponent(heatNo));
        historyUI.editing = false;
        historyUI.msg = 'Saved ' + jobs.length + ' change(s).'; historyUI.msgBad = false;
        try { historyUI.list = await apiFetch('/heats'); } catch (_) { }
      } catch (e) {
        historyUI.error = null; historyUI.msg = 'Save failed: ' + e.message; historyUI.msgBad = true;
      }
      render();
    }
    /* ---- Continue a server heat in the calculator ---- */
    function hxCanContinue(d) {
      if (!session) return false;
      if (session.role === 'admin') return true;
      return d.created_by_code === session.id && d.status !== 'RELEASED';
    }

    function loadServerHeatIntoCalculator(d) {
      const calc = d.calculator;                                   // 'casting' | 'ingot'
      const master = masterDataFor(calc);
      const grade = master.grades.find(g => g.name === d.gradeName);
      if (!grade) {
        alert('Grade "' + d.gradeName + '" is not in the ' + calc + ' master data, so this heat cannot be opened in the calculator.');
        return false;
      }
      const g = grade.name;
      const info = d.heatInfo || {};
      const str = v => String(Number(v));
      const has = v => v !== null && v !== undefined && v !== '';

      state.calculator = calc;
      state.view = 'calculator';
      const s = state[calc];
      s.grade = g;

      // wipe this grade's old values, then seed defaults (same idea as "Reset Grade")
      ['target', 'oes', 'oesTwo', 'chargeRows', 'corrections', 'residualElements', 'residualLimits',
        'residualActual', 'yieldLoss', 'processData', 'ingotProduction'].forEach(k => { delete s[k][g]; });
      s.heat = { ...freshCalcState().heat, ...(info.heat || {}), heatId: d.id };
      s.customerAimApproved = false;
      s.lastAutoNote = null;
      ensureGradeState(calc, g);

      // chemistry
      Object.entries(d.targets || {}).forEach(([el, v]) => { if (has(v)) s.target[g][el] = str(v); });
      Object.entries(d.oes1 || {}).forEach(([el, v]) => { if (has(v)) s.oes[g][el] = str(v); });
      Object.entries(d.oes2 || {}).forEach(([el, v]) => { if (has(v)) s.oesTwo[g][el] = str(v); });

      // charge mix: server rows first, then empty rows for the other compatible scraps
      const skipped = [];
      const rows = [];
      (d.chargeRows || []).forEach(r => {
        if (master.scrapMaterials[r.scrapName]) rows.push({ id: uid(), scrap: r.scrapName, qty: Number(r.qtyKg) ? str(r.qtyKg) : '' });
        else skipped.push(r.scrapName);
      });
      grade.compatibleScrap.forEach(name => { if (!rows.some(r => r.scrap === name)) rows.push({ id: uid(), scrap: name, qty: '' }); });
      s.chargeRows[g] = rows;

      // residuals
      s.residualElements[g] = (d.residuals || []).map(r => r.element);
      (d.residuals || []).forEach(r => {
        if (has(r.limitPct)) s.residualLimits[g][r.element] = str(r.limitPct);
        if (has(r.actualPct)) s.residualActual[g][r.element] = str(r.actualPct);
      });

      // yield: full breakdown from heat_info, weights from the server columns (admin may have edited them)
      s.yieldLoss[g] = { ...s.yieldLoss[g], ...(info.yieldLoss || {}) };
      if (has(d.yieldLoss && d.yieldLoss.chargedWeightKg)) s.yieldLoss[g].chargedWeight = str(d.yieldLoss.chargedWeightKg);
      if (has(d.yieldLoss && d.yieldLoss.finalMetalWeightKg)) s.yieldLoss[g].finalMetalWeight = str(d.yieldLoss.finalMetalWeightKg);

      // extras that only live in heat_info
      s.processData[g] = { ...s.processData[g], ...(info.processData || {}) };
      s.ingotProduction[g] = { ...s.ingotProduction[g], ...(info.ingotProduction || {}) };
      s.corrections[g] = Array.isArray(info.corrections) ? info.corrections : [];
      ['heatSize', 'yieldPct', 'meltingRate', 'powerRate', 'otherRate', 'sellingPrice'].forEach(k => { if (has(info[k])) s[k] = String(info[k]); });

      // server approvals -> local approval ticks
      const a = d.approvals || {};
      s.approvals = { operator: !!a.operator, meltingIncharge: !!a.melting_incharge, metallurgy: !!a.metallurgist, qa: !!a.qa };

      // THE LINK: the next "Re-sync" updates this same heat instead of creating a new one
      backend.linkedHeatId[calc + '|' + g] = d.id;
      backend.lastServerCheck = null;
      backend.lastError = null;

      historyUI.detail = null;
      historyUI.editing = false;
      render();
      window.scrollTo(0, 0);
      if (skipped.length) alert('These charge rows were skipped because the scrap is not in the master data: ' + skipped.join(', '));
      verifyWithBackend().then(render).catch(() => { });   // show the server's view right away (best effort)
      return true;
    }

    function hxContinue() {
      const d = historyUI.detail;
      if (!d || !hxCanContinue(d)) return;
      if (!confirm('Open heat ' + d.id + ' in the ' + d.calculator + ' calculator?\n\nValues currently entered for grade "' + d.gradeName + '" in that calculator will be replaced. Re-sync will then update this same heat.')) return;
      loadServerHeatIntoCalculator(d);
    }
    function hxClick(action, btn) {
      if (action === 'hxSetView') {
        state.view = btn.dataset.view;
        historyUI.detail = null; historyUI.editing = false; historyUI.msg = '';
        if (state.view === 'history') hxLoadList(); else render();
      }
      else if (action === 'hxOpen') hxOpen(btn.dataset.heat);
      else if (action === 'hxBack') { historyUI.detail = null; historyUI.editing = false; historyUI.msg = ''; historyUI.error = null; render(); }
      else if (action === 'hxEdit') { if (hxIsAdmin()) { historyUI.editing = true; historyUI.msg = ''; render(); } }
      else if (action === 'hxCancel') { historyUI.editing = false; historyUI.msg = ''; render(); }
      else if (action === 'hxSave') hxSave();
      else if (action === 'hxRefresh') hxLoadList();
      else if (action === 'hxContinue') hxContinue();
    }

    // Filters update only the table body, so the search box keeps focus while typing.
    function hxRefreshTable() {
      const body = document.getElementById('hxBody');
      if (body) body.innerHTML = hxTableRows();
      const c = document.getElementById('hxCount');
      if (c) c.textContent = hxCountText();
    }
    app.addEventListener('input', (e) => {
      if (e.target.id === 'hxSearch') { historyUI.q = e.target.value; hxRefreshTable(); }
    });
    app.addEventListener('change', (e) => {
      if (e.target.id === 'hxCalc') { historyUI.calc = e.target.value; hxRefreshTable(); }
      else if (e.target.id === 'hxStatus') { historyUI.status = e.target.value; hxRefreshTable(); }
    });

    /* ================= 14. EVENTS ================= */
    function withFocusPreserved(fn) {
      const active = document.activeElement;
      let sig = null;
      if (active && active.dataset && active.dataset.action) {
        sig = { action: active.dataset.action, element: active.dataset.element, row: active.dataset.row, start: active.selectionStart, end: active.selectionEnd };
      }
      fn();
      render();
      if (sig) {
        let sel = `[data-action="${sig.action}"]`;
        if (sig.element) sel += `[data-element="${CSS.escape(sig.element)}"]`;
        if (sig.row) sel += `[data-row="${CSS.escape(sig.row)}"]`;
        const el = app.querySelector(sel);
        if (el) {
          el.focus();
          if (typeof sig.start === 'number' && el.setSelectionRange) {
            try { el.setSelectionRange(sig.start, sig.end); } catch (e) { }
          }
        }
      }
    }

    app.addEventListener('input', (e) => {
      const t = e.target;
      const action = t.dataset.action;
      if (!action) return;

      if (['heatSize', 'yieldPct', 'meltingRate', 'powerRate', 'otherRate', 'sellingPrice'].includes(action)) {
        withFocusPreserved(() => { activeState()[action] = t.value; });
      }
      else if (action === 'target') {
        const el = t.dataset.element;
        withFocusPreserved(() => {
          const s = activeState();
          if (!s.target[s.grade]) s.target[s.grade] = {};
          s.target[s.grade][el] = t.value;
        });
      }
      else if (action === 'oes') {
        const el = t.dataset.element;
        withFocusPreserved(() => {
          const s = activeState();
          if (!s.oes[s.grade]) s.oes[s.grade] = {};
          s.oes[s.grade][el] = t.value;
        });
      }
      else if (action === 'rowQty') {
        const rowId = t.dataset.row;
        withFocusPreserved(() => {
          const row = chargeRowsFor().find(r => r.id === rowId);
          if (row) row.qty = t.value;
          activeState().lastAutoNote = null;
        });
      }
      /* ---- Heat Identification text fields ---- */
      else if (['heatDate', 'heatTime', 'furnaceId', 'furnaceType', 'operator', 'meltingIncharge', 'metallurgist',
        'customer', 'product', 'partNumber', 'drawingNumber', 'drawingRevision', 'poNumber', 'workOrder'].includes(action)) {
        const map = { heatDate: 'date', heatTime: 'time' };
        const key = map[action] || action;
        withFocusPreserved(() => { activeState().heat[key] = t.value; });
      }
      /* ---- OES-2 ---- */
      else if (action === 'oesTwo') {
        const el = t.dataset.element;
        withFocusPreserved(() => {
          const s = activeState();
          if (!s.oesTwo[s.grade]) s.oesTwo[s.grade] = {};
          s.oesTwo[s.grade][el] = t.value;
        });
      }
      /* ---- Yield & Loss ---- */
      else if (action.startsWith('yl-')) {
        const key = action.slice(3);
        withFocusPreserved(() => { yieldLossState()[key] = t.value; });
      }
      /* ---- Process Data ---- */
      else if (action.startsWith('pd-')) {
        const key = action.slice(3);
        withFocusPreserved(() => { processDataState()[key] = t.value; });
      }
      /* ---- Residuals ---- */
      else if (action === 'residualActual') {
        const el = t.dataset.element;
        withFocusPreserved(() => { activeState().residualActual[activeState().grade][el] = t.value; });
      }
      else if (action === 'residualLimit') {
        const el = t.dataset.element;
        withFocusPreserved(() => { activeState().residualLimits[activeState().grade][el] = t.value; });
      }
      /* ---- Applied correction quantity edit ---- */
      else if (action === 'correctionQty') {
        const corrId = t.dataset.corr;
        withFocusPreserved(() => {
          const c = correctionsFor().find(x => x.id === corrId);
          if (c) c.qty = t.value;
        });
      }
      /* ---- Alloy Addition Master (Master Data admin) ---- */
      else if (action === 'alloyName') {
        const id = t.dataset.alloy;
        withFocusPreserved(() => { const a = alloyAdditionMaster.find(x => x.id === id); if (a) { a.name = t.value; saveAlloyMaster(); } });
      }
      else if (action === 'alloyChem') {
        const id = t.dataset.alloy, el = t.dataset.element;
        withFocusPreserved(() => { const a = alloyAdditionMaster.find(x => x.id === id); if (a) { a.chemistry[el] = t.value; saveAlloyMaster(); } });
      }
      else if (action === 'alloyRecovery') {
        const id = t.dataset.alloy, el = t.dataset.element;
        withFocusPreserved(() => { const a = alloyAdditionMaster.find(x => x.id === id); if (a) { a.recovery[el] = t.value; saveAlloyMaster(); } });
      }
      else if (action === 'alloyRate') {
        const id = t.dataset.alloy;
        withFocusPreserved(() => { const a = alloyAdditionMaster.find(x => x.id === id); if (a) { a.rate = t.value; saveAlloyMaster(); } });
      }
      /* ---- Ingot Product Master text/number fields ---- */
      else if (action === 'ipmField') {
        const id = t.dataset.ipm, field = t.dataset.field;
        withFocusPreserved(() => { const p = ingotProductMaster.find(x => x.id === id); if (p) { p[field] = t.value; saveIngotProductMaster(); } });
      }
      /* ---- Ingot Production target fields ---- */
      else if (action === 'ip-targetWeight' || action === 'ip-numberOfIngots' || action === 'ip-toleranceKg') {
        const key = action.slice(3);
        withFocusPreserved(() => {
          const ip = ingotProductionState();
          ip[key] = t.value;
          if (key === 'numberOfIngots') {
            const n = Math.max(0, Math.floor(num(t.value)));
            const arr = ip.actualWeights || [];
            if (arr.length < n) while (arr.length < n) arr.push('');
            else if (arr.length > n) arr.length = n;
            ip.actualWeights = arr;
          }
        });
      }
      else if (action === 'ingotWeight') {
        const idx = parseInt(t.dataset.idx, 10);
        withFocusPreserved(() => { ingotProductionState().actualWeights[idx] = t.value; });
      }
    });

    app.addEventListener('change', (e) => {
      const t = e.target;
      const action = t.dataset.action;
      if (action === 'grade') {
        activeState().grade = t.value;
        ensureGradeState(activeCalc(), activeState().grade);
        render();
      }
      else if (action === 'rowScrap') {
        const rowId = t.dataset.row;
        const row = chargeRowsFor().find(r => r.id === rowId);
        if (row) row.scrap = t.value;
        activeState().lastAutoNote = null;
        render();
      }
      else if (action === 'customerAimApproved') {
        activeState().customerAimApproved = t.checked;
        render();
      }
      else if (action === 'addResidual') {
        if (t.value) { residualElementsFor().push(t.value); }
        render();
      }
      else if (action === 'approval') {
        activeState().approvals[t.dataset.role] = t.checked;
        render();
      }
      else if (action === 'alloyActive') {
        const id = t.dataset.alloy;
        const a = alloyAdditionMaster.find(x => x.id === id);
        if (a) { a.active = t.checked; saveAlloyMaster(); }
        render();
      }
      else if (action === 'ipmActive') {
        const id = t.dataset.ipm;
        const p = ingotProductMaster.find(x => x.id === id);
        if (p) { p.active = t.checked; saveIngotProductMaster(); }
        render();
      }
      else if (action === 'ipmField' && t.tagName === 'SELECT') {
        const id = t.dataset.ipm, field = t.dataset.field;
        const p = ingotProductMaster.find(x => x.id === id);
        if (p) { p[field] = t.value; saveIngotProductMaster(); }
        render();
      }
    });

    app.addEventListener('click', (e) => {
      const btn = e.target.closest('[data-action]');
      if (!btn) return;
      const action = btn.dataset.action;

      if (action.startsWith('hx')) { hxClick(action, btn); return; }

      if (action === 'printCalc') { openPrintWindow(); return; }

      if (action === 'setCalculator') {
        state.view = 'calculator';
        state.calculator = btn.dataset.calc;
        render();
        return;
      }
      if (action === 'toggleDetails') {
        activeState().showDetails = !activeState().showDetails;
        render();
        return;
      }
      if (action === 'resetGrade') {
        const s = activeState(), g = s.grade;
        delete backend.linkedHeatId[state.calculator + '|' + g];
        delete s.target[g];
        delete s.oes[g];
        delete s.chargeRows[g];
        delete s.oesTwo[g];
        delete s.corrections[g];
        delete s.residualElements[g];
        delete s.residualLimits[g];
        delete s.residualActual[g];
        delete s.yieldLoss[g];
        delete s.processData[g];
        delete s.ingotProduction[g];
        s.lastAutoNote = null;
        ensureGradeState(activeCalc(), g);
        render();
        return;
      }
      if (action === 'rowAdd') {
        const compat = getCompatibleScrap();
        chargeRowsFor().push({ id: uid(), scrap: compat[0] || '', qty: '' });
        render();
        return;
      }
      if (action === 'rowRemove') {
        const rowId = btn.dataset.row;
        const s = activeState();
        s.chargeRows[s.grade] = (s.chargeRows[s.grade] || []).filter(r => r.id !== rowId);
        render();
        return;
      }
      if (action === 'chargeAuto') {
        runAutoCalculate();
        render();
        return;
      }
      if (action === 'chargeManual') {
        resetChargeManual();
        render();
        return;
      }
      if (action === 'removeResidual') {
        const el = btn.dataset.element;
        const s = activeState();
        s.residualElements[s.grade] = residualElementsFor().filter(x => x !== el);
        delete s.residualActual[s.grade][el];
        delete s.residualLimits[s.grade][el];
        render();
        return;
      }
      if (action === 'showCorrectionCalc') {
        const el = btn.dataset.el;
        const box = document.getElementById('cc-calc-' + el);
        if (box) box.style.display = box.style.display === 'none' ? 'block' : 'none';
        return;
      }
      if (action === 'applyCorrection') {
        const additionId = btn.dataset.addition;
        const qty = btn.dataset.qty;
        correctionsFor().push({ id: uid(), additionId, qty: String(round(num(qty), 2)) });
        render();
        return;
      }
      if (action === 'removeCorrection') {
        const corrId = btn.dataset.corr;
        const s = activeState();
        s.corrections[s.grade] = correctionsFor().filter(c => c.id !== corrId);
        render();
        return;
      }
      if (action === 'applyDilution') {
        const material = btn.dataset.material;
        const qty = btn.dataset.qty;
        const compat = getCompatibleScrap();
        if (!compat.includes(material)) {
          alert(`${material} is not in this grade's compatible-scrap list. Add it to the Charge Mix manually if you want to use it as a diluent — this planning tool will not silently add an incompatible material.`);
          return;
        }
        const existing = chargeRowsFor().find(r => r.scrap === material);
        if (existing) { existing.qty = String(round(num(existing.qty) + num(qty), 1)); }
        else { chargeRowsFor().push({ id: uid(), scrap: material, qty: String(round(num(qty), 1)) }); }
        activeState().lastAutoNote = null;
        render();
        return;
      }
      if (action === 'saveHeatHistory') {
        saveCurrentHeatToHistory();
        render();
        return;
      }
      if (action === 'viewHeat') { loadHeatFromHistory(btn.dataset.heat); return; }
      if (action === 'duplicateHeat') { duplicateHeatFromHistory(btn.dataset.heat); return; }
      if (action === 'deleteHeat') { deleteHeatFromHistory(btn.dataset.heat); return; }
      if (action === 'alloyAdd') {
        alloyAdditionMaster.push(newAlloyAddition());
        saveAlloyMaster();
        render();
        return;
      }
      if (action === 'alloyRemove') {
        const id = btn.dataset.alloy;
        alloyAdditionMaster = alloyAdditionMaster.filter(a => a.id !== id);
        saveAlloyMaster();
        render();
        return;
      }
      if (action === 'ipmAdd') {
        ingotProductMaster.push(newIngotProduct());
        saveIngotProductMaster();
        render();
        return;
      }
      if (action === 'ipmRemove') {
        const id = btn.dataset.ipm;
        ingotProductMaster = ingotProductMaster.filter(p => p.id !== id);
        saveIngotProductMaster();
        render();
        return;

      /* ---- Backend integration actions (all async — set a busy state, run, re-render) ---- */
      if (action === 'backendLoginBtn') {
